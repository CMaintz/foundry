# Foundry architecture fitness - Python (import-linter).
#
# Deterministic, whole-graph enforcement of YOUR architecture: layer boundaries +
# framework-freedom. Runs under the opt-in `arch` task (fold into `lint` once your
# layers are filled - see mise/python.toml). Whole-graph, so it always runs whole-tree,
# never changed-scoped (one stray import anywhere can break a layer).
#
# Copy this to `.importlinter` at your repo root (or inline it under [tool.importlinter]
# in pyproject.toml / [importlinter] in setup.cfg). Then set root_package and edit the
# `layers`/`forbidden` contracts to YOUR architecture. See presets/arch/SETUP.md.
#
# ARCHITECTURE-AGNOSTIC. Hexagonal (AutoApplicant's shape) is the default; swap the
# contracts for classic-layered, clean/onion, or modular - see the examples at the
# bottom and docs/designs/arch-fitness.md.
#
# MENTAL MODEL - this is where Python differs from the dep-cruiser/ArchUnit presets:
#   * A "layer" is a MODULE PATH under root_package, NOT a filesystem regex. `domain`
#     means the `<root_package>.domain` package. `containers` names the parent package
#     the layer names are relative to.
#   * In a `layers` contract, layers are listed HIGH to LOW. A higher layer may import a
#     lower one; a lower layer may NOT import a higher one. Siblings on one line
#     (separated by ` | `) are independent: neither may import the other.
#   * The `layers` contract enforces that one-way direction between the named layers
#     (which rules out cross-layer cycles). There is NO whole-graph "no cycles anywhere"
#     contract like dependency-cruiser's no-circular - import-linter has no equivalent.
#
# RATCHET - also different from the other two stacks. import-linter has no external
# baseline file; accepted violations are recorded INLINE as `ignore_imports` lines in
# this file (format: `importer -> imported`). That makes this file simultaneously the
# ruleset AND the baseline, so it rides the ruleset-change control: ANY edit here next
# to a production-source change needs the `ruleset-change` label - including pruning an
# `ignore_imports` entry. (TS/Java keep their baseline in a separate file that may be
# pruned label-free; Python cannot.) The rot-prevention half still holds for free:
# `unmatched_ignore_imports_alerting = error` (the default) fails the build if an
# `ignore_imports` entry no longer matches a real import - so a fixed violation can
# never sit silently suppressed. See presets/arch/SETUP.md "Python" for the full story.

[importlinter]
root_package = myproject
# Required for the framework-freedom `forbidden` contract below (it names third-party
# packages). Drop it if you keep only `layers` contracts over your own packages.
include_external_packages = True

# --- Layer boundaries (hexagonal example) -----------------------------------
# Listed HIGH -> LOW. config (composition root) may import everything beneath it;
# domain (the framework-free core) may import nothing above it.
[importlinter:contract:layers]
name = Hexagonal layer boundaries
type = layers
containers =
    myproject
layers =
    config
    adapter
    usecase
    port
    domain
# Record today's accepted violations here as `importer -> imported`, one per line, to
# retrofit onto a dirty codebase without a red day-one wall. This list is the baseline:
# it may only ever SHRINK. error-on-unmatched (below) stops it rotting.
# ignore_imports =
#     myproject.domain.user -> myproject.adapter.db
unmatched_ignore_imports_alerting = error

# --- Framework-freedom: the domain stays plain ------------------------------
# The core must not import a web/ORM/DI framework. Needs include_external_packages above.
[importlinter:contract:domain-framework-free]
name = Domain is framework-free
type = forbidden
source_modules =
    myproject.domain
forbidden_modules =
    django
    flask
    fastapi
    sqlalchemy
    pydantic
unmatched_ignore_imports_alerting = error

# ---- example architectures (replace the contracts above) -------------------
#
# Classic layered (n-tier): web -> service -> data, one direction only.
#   [importlinter:contract:layers]
#   type = layers
#   containers = myproject
#   layers =
#       web
#       service
#       data
#
# Clean / onion: entities <- usecases <- interfaces <- frameworks (frameworks highest).
#   layers =
#       frameworks
#       interfaces
#       usecases
#       entities
#
# Modular / feature isolation: features never import each other. Use an `independence`
# contract (not `layers`); a shared kernel is allowed because it is not listed here.
#   [importlinter:contract:features-independent]
#   name = Features are independent
#   type = independence
#   modules =
#       myproject.features.billing
#       myproject.features.auth
