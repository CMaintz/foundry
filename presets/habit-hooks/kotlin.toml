# Copy to <repo>/.habit-hooks/config.toml
# There's no habit-hooks Kotlin sensor yet, so structural smells come from detekt
# in `mise run lint` (the gate). This preset runs only the language-independent
# `generic` (jscpd) duplication check. Add a habit-hooks-kotlin plugin here if one
# ships.
plugins = ["generic"]

# Tests are not smell-scanned (language-agnostic principle — see README).
files = ["**/*.kt", "**/*.kts", "!**/src/test/**/*.kt", "!**/src/test/**/*.kts"]
