# Copy to <repo>/.habit-hooks/config.toml
# There's no habit-hooks .NET sensor yet, so structural smells come from Roslyn
# analyzers in `mise run lint` / the build (with -warnaserror). This preset runs
# only the language-independent `generic` (jscpd) duplication check.
plugins = ["generic"]

# Tests are not smell-scanned (language-agnostic principle — see README).
files = ["**/*.cs", "!**/*Tests/**", "!**/*Tests.cs", "!**/*.Test.cs"]

# File-length: flag files over 300 lines (oversized-file). 300 rather than the
# sensor default of 200 — verbose-but-cohesive files (esp. Java) legitimately pass
# 200, and this is a ratcheted coaching signal, not a hard wall. Config/data/prose
# are already excluded by the `files` globs; keep big prompts in their own resource file.
[sensors.line-count]
args = ["--max", "300"]
