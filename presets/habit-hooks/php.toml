# Copy to <repo>/.habit-hooks/config.toml
# Detector: phpmd (bundled). Provides oversized-file, oversized-function, etc.
plugins = ["php", "generic"]

# Tests are not structural-smell-gated: long, fixture-heavy test methods are normal
# and fine. CI should police production maintainability, not test structure.
# (Language-agnostic principle — see README.)
files = ["**/*.php", "!**/tests/**", "!**/*Test.php"]

# File-length: flag files over 300 lines (oversized-file). 300 rather than the
# sensor default of 200 — verbose-but-cohesive files (esp. Java) legitimately pass
# 200, and this is a ratcheted coaching signal, not a hard wall. Config/data/prose
# are already excluded by the `files` globs; keep big prompts in their own resource file.
[sensors.line-count]
args = ["--max", "300"]
