# Copy to <repo>/.habit-hooks/config.toml
# Detector: phpmd (bundled). Provides oversized-file, oversized-function, etc.
plugins = ["php", "generic"]

# Tests are not structural-smell-gated: long, fixture-heavy test methods are normal
# and fine. CI should police production maintainability, not test structure.
# (Language-agnostic principle — see README.)
files = ["**/*.php", "!**/tests/**", "!**/*Test.php"]
