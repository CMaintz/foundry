# Copy to <repo>/.habit-hooks/config.toml
plugins = ["typescript", "generic"]

# Tests are not structural-smell-gated: long, mock-heavy specs are normal and fine.
# CI should police production maintainability, not test structure. (Language-
# agnostic principle — see README.)
files = ["**/*.ts", "**/*.tsx", "!**/*.spec.ts", "!**/*.spec.tsx", "!**/*.test.ts", "!**/*.test.tsx"]
