# Copy to <repo>/.habit-hooks/config.toml
# Detector: PMD. Provides oversized-file, oversized-function, high-complexity, etc.
#
# TOML ordering matters: top-level keys (plugins, files) MUST come before any
# [table] header, or the parser attributes them to the table.
plugins = ["java", "generic"]

# Tests are not structural-smell-gated: long, mock-heavy test methods and many
# fixtures are normal and fine. CI should police production maintainability, not
# test structure. (Language-agnostic principle — see README.)
files = ["**/*.java", "!**/src/test/**/*.java"]

# args MUST be a TOML array, not a string — habit-hooks mangles a string into
# per-character ruleset refs (PMD: "Cannot load ruleset -/n/o/..."), breaking the
# scan. As an array each element is a clean token. -R names the tuned ruleset (see
# ../pmd/ruleset.xml -> copy to <repo>/pmd/ruleset.xml) so a missing/misplaced one
# fails loudly instead of SILENTLY falling back to bundled minimum=4. --no-progress
# silences PMD's progress-bar WARN.
# --suppress-marker: a line with `// foundry-allow-smell: <reason>` suppresses PMD on
# it, so a *genuine* non-seam (a linear toEntity/save mapper, a flat long builder) can
# be accepted on the record — reviewable in the diff — instead of forced into a
# split-to-pass or silently steered around. Use sparingly, always with a reason; it is
# NOT for dodging a real refactor. (Mirrors `foundry-allow-var` for the no-var check.)
[sensors.pmd]
args = ["--no-progress", "-R", "pmd/ruleset.xml", "--suppress-marker", "foundry-allow-smell"]

# unused-import: PMD's UnnecessaryImport runs here WITHOUT an aux-classpath, so it
# cannot resolve wildcard-import usage and false-flags e.g. `jakarta.persistence.*`
# on JPA entities. It is also redundant — a formatter (Spotless removeUnusedImports)
# already enforces unused imports correctly, WITH a classpath, in the gate. Disable
# it so the snooze baseline stays honest. Remove this block if you don't run a
# formatter that strips unused imports.
[smells.unused-import]
disabled = true

# too-many-parameters (PMD ExcessiveParameterList) defaults to minimum=4, which
# fires on ordinary Spring DI constructors and records (data carriers) — noise. The
# copied pmd/ruleset.xml raises it to a real god-class signal (8); the -R above
# points PMD at it, and findings still map to smells by PMD rule name. See README
# ("Tuning thresholds").

# File-length: flag files over 300 lines (oversized-file). 300 rather than the
# sensor default of 200 — verbose-but-cohesive files (esp. Java) legitimately pass
# 200, and this is a ratcheted coaching signal, not a hard wall. Config/data/prose
# are already excluded by the `files` globs; keep big prompts in their own resource file.
[sensors.line-count]
args = ["--max", "300"]
