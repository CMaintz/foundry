# Foundry verb interface - Kotlin (Gradle) template. See CONTRACT.md.
# Commands assume ktlint (style) + detekt (structural smells) + osv-scanner.
# Adjust for Maven or your plugins.

[tools]
java = "21" # Kotlin compiles on the JVM; pin to what the repo targets
gitleaks = "8.24.3" # audit's secret scan

[env]
# The Foundry scripts (foundry-verb-wrap, foundry-flaky, codemap-check) are provisioned by
# setup:foundry-scripts into a cache dir at this ref, not vendored (see that task). Renovate
# tracks the pin via the comment above it.
# A bump must also update the sha256 lines in setup:foundry-scripts.
# renovate: datasource=github-tags depName=CMaintz/foundry
FOUNDRY_SCRIPTS_REF = "v2.13.0"
# The Foundry scripts cache (so the gate runs `foundry-verb-wrap` by name), then the
# repo's own scripts/.
_.path = [
    "{{env.HOME}}/.local/opt/foundry-scripts-{{env.FOUNDRY_SCRIPTS_REF}}",
    "{{config_root}}/scripts",
]
# Loop telemetry: each gate verb appends one JSONL line here (see designs/loop-telemetry.md).
# Read it with the `foundry:loop-report` skill. setup:foundry-scripts caches the wrapper.
FOUNDRY_TELEMETRY = "{{config_root}}/.foundry/telemetry.jsonl"

# -- Jev (advisory layer; opt-in, OFF unless set) --------------------------
# Foundry's near-free System One layer (see docs/FEATURES.md, the "jev/" entry):
# it only routes review and triages turns on the proposer side, never the gate.
# All of it stays off unless a key is present, so this whole block is optional.
#
# The key is NEVER committed: export JEV_API_KEY in your shell, not here. The
# lines below are the safe, non-secret knobs at their defaults; uncomment to
# change one. mise [env] reaches only processes under `mise run`/`mise exec` or
# a mise-activated shell, so a Claude Code hook sees these only when the editor
# was launched from such a shell.
#
# JEV_PROVIDER = "typesafe"           # or "cloudflare" (then set CLOUDFLARE_ACCOUNT_ID)
# JEV_MODEL = "jev-latest"            # pin to a version to freeze behavior
# TYPESAFE_AI_BASE_URL = "https://api.typesafe.ai/v1"   # a self-host, proxy, or mock
# JEV_REVIEW_MIN_FILES = "0"          # skip review routing on diffs at or under N files
# JEV_TOOLCALL_TRIAGE = "0"           # 1 warns on risky tool calls (repos with that hook)
# JEV_FEATURE_PRECHECK = "0"          # 1 pre-checks a feature ticket (repos with that hook)
# LEASH_ENABLED = "0"                 # 1 runs Leash turn checks (repos with the leash.sh hook)

[hooks]
# Provision the cached Foundry scripts on `mise install` (local and CI alike). This is
# the only postinstall this template has - kotlin runs an inline gate with no habit-hooks venv.
postinstall = "mise run setup:foundry-scripts"

# Fetch the pinned Foundry scripts into a cache dir instead of copying them into the repo
# (agent/CI plumbing, not the repo's code; a copy drifts and needs a re-sync on every bump).
# Every run checks each script against its sha256 below, cached or not: the tag is only a
# locator, so a moved tag, a proxy page or a truncated download is re-fetched once and then
# refused, never cached. A verified cache needs no network, so the gate hot path stays
# offline; a ref bump needs the network once. cut-release.sh writes the digests for the tag
# it cuts, so bumping FOUNDRY_SCRIPTS_REF means taking that tag's digest lines with it.
[tasks."setup:foundry-scripts"]
description = "Fetch the pinned Foundry scripts into a cache dir, sha256-verified"
run = '''
set -eu
# <script> <sha256 of scripts/<script> at FOUNDRY_SCRIPTS_REF>, one per line.
scripts='
foundry-verb-wrap 62d37f02653ee1878e66e5366ee51bedb46aefa935716668adc07d078db02e85
foundry-flaky 4ac1cc27da1071865be3db14c27cfe179ef1bc2aafaa069d8b62801cf920f07f
codemap-check 31a57b4ec25237598abb29f34a28dbcbd1331cee0ca939a9dd8e9caa3985b5da
'
dst="$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF"
base="https://raw.githubusercontent.com/CMaintz/foundry/$FOUNDRY_SCRIPTS_REF/scripts"
# sha256sum ships with Linux and Git Bash; macOS has only shasum.
digest() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
mkdir -p "$dst"
while read -r s want; do
  [ -n "$s" ] || continue
  [ -f "$dst/$s" ] && [ "$(digest "$dst/$s")" = "$want" ] && continue
  # A per-run temp file, moved into place only once verified: concurrent runs (parallel
  # worktrees share $HOME) never write into each other's download or expose a partial one.
  tmp=$(mktemp "$dst/.$s.XXXXXX")
  if ! curl -fsSL "$base/$s" -o "$tmp"; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: cannot fetch $s at $FOUNDRY_SCRIPTS_REF (network needed once per ref)" >&2
    exit 1
  fi
  got=$(digest "$tmp")
  if [ "$got" != "$want" ]; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: $s at $FOUNDRY_SCRIPTS_REF has sha256 $got, expected $want; refusing it." >&2
    echo "  If FOUNDRY_SCRIPTS_REF was just bumped, copy the digest lines from that ref's mise template;" >&2
    echo "  otherwise the download was not the script (proxy or captive page, truncation, moved tag)." >&2
    exit 1
  fi
  chmod +x "$tmp" 2>/dev/null || true
  mv -f "$tmp" "$dst/$s"
done <<EOF
$scripts
EOF
'''

[tasks.fix]
description = "Auto-format (ktlint)"
run = "./gradlew ktlintFormat"

[tasks.lint]
description = "Style (ktlint) + structural smells (detekt)"
# detekt is Kotlin's smell detector - the analogue of PMD for Java. Wire a detekt
# baseline (detektBaseline) for the ratchet, so only new smells fail.
run = "./gradlew ktlintCheck detekt"

[tasks.typecheck]
description = "Compilation is Kotlin's type check"
run = "./gradlew compileKotlin"

[tasks.test]
description = "Tests (wire a coverage floor via kover or jacoco)"
run = "./gradlew test"

[tasks."test:flaky"]
description = "Tests, with quarantined flakes reported but not gating (flaky-baseline.json)"
# foundry-flaky is a python3 script, so this opt-in task needs python3 on PATH - the rest of
# the Kotlin gate does not.
run = '''
set -eu
dir="build/test-results/test"
# Clear stale per-class XML first: `|| true` swallows a compile failure, and Gradle leaves
# old files behind, so stale XML could otherwise pass the glob and gate green on old results.
rm -rf "$dir"
./gradlew test || true
if ! ls "$dir"/*.xml >/dev/null 2>&1; then
  echo "test:flaky: no JUnit XML under $dir - the suite did not run (compile error?)." >&2
  exit 1
fi
foundry-flaky gate "$dir" flaky-baseline.json
'''

# Codemap drift check (advisory auxiliary, deliberately not in `gate` or `lint`): every
# citation in docs/codemap/*.md must still resolve, and each slice prints how many commits
# touched its cited files since its `sha:`. Exits 0 with a notice when there is no map.
# `codemap-check` is a python3 script on PATH via the setup:foundry-scripts cache dir.
[tasks."codemap:check"]
description = "Advisory: codemap citations still resolve, and how stale each slice is"
run = "codemap-check"

[tasks.audit]
description = "Dependency CVEs via osv-scanner over a Gradle lockfile (needs osv-scanner on PATH), and secrets (gitleaks)"
# Enable dependencyLocking { lockAllConfigurations() }; lockfile generated on
# demand (gitignored) so lock drift never breaks the gate.
# The secret scan covers the working tree as git sees it (tracked and untracked files,
# minus .gitignore'd ones), so a key is caught before it is committed. It copies that
# tree out through a throwaway index rather than running `gitleaks dir .` directly,
# which would also read ignored dependency trees (.venv, vendor/, build output) whose
# bundled example keys fail the gate on day one. The repo-root .gitleaks.toml is passed
# explicitly because a package-level mise.toml runs from the package dir, where gitleaks
# would not find it. SAST stays in CI (security.yml).
run = [
    "./gradlew dependencies --write-locks",
    "osv-scanner --lockfile=gradle.lockfile",
    '''
set -eu
root=$(git rev-parse --show-toplevel)
prefix=$(git rev-parse --show-prefix)
set --
if [ -f "$root/.gitleaks.toml" ]; then set -- --config "$root/.gitleaks.toml"; fi
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
idx=$(git rev-parse --git-path index)
if [ -f "$idx" ]; then cp "$idx" "$tmp/index"; fi
GIT_INDEX_FILE="$tmp/index" git -c core.safecrlf=false add -A -- .
GIT_INDEX_FILE="$tmp/index" git checkout-index -a --prefix="$tmp/tree/"
cd "$tmp/tree/$prefix"
gitleaks dir --no-banner --redact "$@" .
''',
]

[tasks.gate]
description = "The oracle. Sequential - the VERBS must never be mise `depends` (those run in parallel)."
# The one setup:foundry-scripts dep provisions the cached gate script first (idempotent,
# ordered-first) - a safety net for a ref bump not yet followed by `mise install`. The
# VERBS stay in the sequential array (never `depends`, which would run them in parallel,
# unordered). Each verb is wrapped by `foundry-verb-wrap`: it times the verb, appends a line
# to FOUNDRY_TELEMETRY, and propagates the exit code unchanged (a failing verb still stops
# the sequence). Wrapper on PATH via the setup:foundry-scripts cache. Not on the six-verb contract.
depends = ["setup:foundry-scripts"]
run = [
    "foundry-verb-wrap lint      -- mise run lint",
    "foundry-verb-wrap typecheck -- mise run typecheck",
    "foundry-verb-wrap test      -- mise run test",
    "foundry-verb-wrap audit     -- mise run audit",
]
