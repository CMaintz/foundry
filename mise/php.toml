# Foundry verb interface - PHP (Composer) template. See CONTRACT.md.
# Commands assume PHP_CodeSniffer + PHP-CS-Fixer + PHPStan + PHPUnit; adjust to taste.

[tools]
php = "8.3"

[env]
# habit-hooks (the structural-smell detector) is a pinned, mise-managed pip tool,
# provisioned into a per-plugin venv by setup:habit-hooks (postinstall) whose bin goes on
# PATH below - so the SAME version runs in-loop, pre-push (`gate`) and in CI (mirrors how
# java.toml pins PMD). Core + its PHP plugin ship in lockstep, so both pin to this one
# version. Renovate bumps it (presets/renovate.json); keep it == the reusable workflow's
# `habit_hooks_version` default (1.5.0).
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "habit-hooks-php"
# The Foundry gate scripts (foundry-verb-wrap) are provisioned by setup:foundry-scripts
# into a cache dir at this ref, not vendored (see that task). Renovate tracks the pin via
# the comment above it.
# renovate: datasource=github-tags depName=CMaintz/foundry
FOUNDRY_SCRIPTS_REF = "v2.12.0"
# The habit-hooks venv bin on PATH (Linux `bin/`, Windows `Scripts/` - a missing one is
# harmless), the Foundry gate scripts cache (so the gate runs `foundry-verb-wrap` by name),
# then the repo's scripts/.
_.path = [
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
    "{{env.HOME}}/.local/opt/foundry-scripts-{{env.FOUNDRY_SCRIPTS_REF}}",
    "{{config_root}}/scripts",
]
# Loop telemetry: each gate verb appends one JSONL line here (see designs/loop-telemetry.md).
# Read it with the `foundry:loop-report` skill. setup:foundry-scripts caches the wrapper.
FOUNDRY_TELEMETRY = "{{config_root}}/.foundry/telemetry.jsonl"

# -- Jev (advisory layer; opt-in, OFF unless set) --------------------------
# Foundry's near-free System One layer (see docs/FEATURES.md, the "jev/" entry):
# it only routes review and triages turns on the proposer side, never the gate.
# All of it stays off unless a key is present, so this whole block is optional.
#
# The key is NEVER committed: export JEV_API_KEY in your shell, not here. The
# lines below are the safe, non-secret knobs at their defaults; uncomment to
# change one. mise [env] reaches only processes under `mise run`/`mise exec` or
# a mise-activated shell, so a Claude Code hook sees these only when the editor
# was launched from such a shell.
#
# JEV_PROVIDER = "typesafe"           # or "cloudflare" (then set CLOUDFLARE_ACCOUNT_ID)
# JEV_MODEL = "jev-latest"            # pin to a version to freeze behavior
# TYPESAFE_AI_BASE_URL = "https://api.typesafe.ai/v1"   # a self-host, proxy, or mock
# JEV_REVIEW_MIN_FILES = "0"          # skip review routing on diffs at or under N files
# JEV_TOOLCALL_TRIAGE = "0"           # 1 warns on risky tool calls (repos with that hook)
# JEV_FEATURE_PRECHECK = "0"          # 1 pre-checks a feature ticket (repos with that hook)
# LEASH_ENABLED = "0"                 # 1 runs Leash turn checks (repos with the leash.sh hook)

[hooks]
# Provision the pinned habit-hooks and the cached Foundry gate scripts on `mise install`
# (local and CI alike), like setup:pmd. Array form, as the java/python templates use.
postinstall = ["mise run setup:habit-hooks", "mise run setup:foundry-scripts"]

# Provision the pinned habit-hooks (core + PHP plugin, same version) into a per-plugin
# venv. Auxiliary (tier c) - not a contract verb, run via postinstall on `mise install`.
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + PHP plugin into a venv (phpmd-backed smell detector)"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
for c in python3 python; do
  if command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION"
'''

# Structural smells (phpmd via habit-hooks), folded into `lint` below (tier b). Same check
# CI's habits job runs, so `gate` is the same oracle locally and in CI. Degrades gracefully
# (skip) with no .habit-hooks config/snooze or an unresolvable base; FAILS only when a
# config + baseline exist but habit-hooks isn't on PATH (run `mise install`).
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
depends = ["setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

[tasks.fix]
description = "Auto-format"
run = "vendor/bin/php-cs-fixer fix"

[tasks.lint]
description = "Codesniffer + phpmd structural smells (habit-hooks)"
# phpcs is the style check; `mise run smells` runs habit-hooks (phpmd) - the same smell
# scan CI runs - so `gate` is the same oracle locally and in CI.
run = ["vendor/bin/phpcs", "mise run smells"]

[tasks.typecheck]
description = "Static analysis (PHP has no compiler; PHPStan is the type check)"
run = "vendor/bin/phpstan analyse"

[tasks.test]
description = "Tests with coverage floor"
run = "vendor/bin/phpunit"

[tasks.audit]
description = "Dependency vulnerabilities"
run = "composer audit"

# Fetch the pinned Foundry gate scripts into a cache dir, rather than vendoring copies into
# the repo (agent/CI plumbing, not the repo's code; a vendored copy drifts and needs a
# re-sync on every bump). Pinned to FOUNDRY_SCRIPTS_REF, provisioned once via postinstall.
# Offline-safe: no network call when every script is already cached at this ref, so the
# gate hot path never depends on the network; a ref bump needs the network once.
[tasks."setup:foundry-scripts"]
description = "Fetch the pinned Foundry gate scripts into a cache dir (de-vendored)"
run = '''
set -eu
dst="$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF"
scripts="foundry-verb-wrap"
need=""
for s in $scripts; do [ -f "$dst/$s" ] || need="$need $s"; done
[ -z "$need" ] && exit 0
mkdir -p "$dst"
base="https://raw.githubusercontent.com/CMaintz/foundry/$FOUNDRY_SCRIPTS_REF/scripts"
for s in $need; do
  if ! curl -fsSL "$base/$s" -o "$dst/$s.part"; then
    echo "setup:foundry-scripts: cannot fetch $s at $FOUNDRY_SCRIPTS_REF (network needed once per ref)" >&2
    rm -f "$dst/$s.part"; exit 1
  fi
  mv "$dst/$s.part" "$dst/$s"
  chmod +x "$dst/$s" 2>/dev/null || true
done
'''

[tasks.gate]
description = "The oracle. Sequential - the VERBS must never be mise `depends` (those run in parallel)."
# The one setup:foundry-scripts dep provisions the cached gate script first (idempotent,
# ordered-first) - a safety net for a ref bump not yet followed by `mise install`. The
# VERBS stay in the sequential array (never `depends`, which would run them in parallel,
# unordered). Each verb is wrapped by `foundry-verb-wrap`: it times the verb, appends a line
# to FOUNDRY_TELEMETRY, and propagates the exit code unchanged (a failing verb still stops
# the sequence). Wrapper on PATH via the setup:foundry-scripts cache. Not on the six-verb contract.
depends = ["setup:foundry-scripts"]
run = [
    "foundry-verb-wrap lint      -- mise run lint",
    "foundry-verb-wrap typecheck -- mise run typecheck",
    "foundry-verb-wrap test      -- mise run test",
    "foundry-verb-wrap audit     -- mise run audit",
]
