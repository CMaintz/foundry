# Foundry verb interface — Java (Gradle) template. See CONTRACT.md.
# Commands assume Gradle + Spotless; structural smells come from habit-hooks'
# Java/PMD plugin, not the Gradle build. Adjust for Maven or your plugins.
# Proven on a Spring Boot repo (AutoApplicant); see OVERVIEW.md.
#
# No FOUNDRY_SINCE execute-scoping here, unlike mise/ts.toml — and that's deliberate,
# not an omission (see designs/changed-scope-gate.md). On the JVM the Gradle build
# dominates wall-clock, and Gradle already scopes the fast placements for free:
# Spotless `spotlessCheck` ratchets from origin/main (only changed files), incremental
# compilation scopes `typecheck`, and up-to-date checks skip unaffected `test` work.
# Bolting a changed-file file-list on top would save little and fight the build tool.
# The one ratchet-scoped check that needs an explicit diff is `novar`, below.

[tools]
java = "21"
# jscpd = the duplicated-code detector for the `generic` habit-hooks plugin (the
# java preset enables it alongside PMD). Pinned via mise so local runs, the
# habit-hooks-guard Stop hook, and CI (mise-action runs `mise install`) all resolve
# the SAME version — an unpinned `npm i -g jscpd` drifts and shifts duplication
# findings between machines. Bump in lockstep with any consumer's pin.
"npm:jscpd" = "5.2.1"

# PMD is a JVM app (launcher + jars) whose GitHub release asset has no OS in its
# name, so it can't be a clean [tools] entry. Pin the version here; setup:pmd
# installs it idempotently, the postinstall hook runs that on `mise install`, and
# its bin goes on mise's PATH — so the habit-hooks Java sensor + no-var find PMD
# with no manual install, identically local and in CI.
[env]
PMD_VERSION = "7.27.0"
# PMD on PATH, plus the repo's scripts/ so the gate can call `foundry-verb-wrap` by name.
_.path = ["{{env.HOME}}/.local/opt/pmd-bin-{{env.PMD_VERSION}}/bin", "{{config_root}}/scripts"]

# Loop telemetry: each gate verb appends one JSONL line here (see designs/loop-telemetry.md).
# Gitignore `.foundry/`. Read it with `foundry-loop-report`. foundry-init installs the wrapper.
FOUNDRY_TELEMETRY = "{{config_root}}/.foundry/telemetry.jsonl"

[hooks]
postinstall = "mise run setup:pmd"

[tasks."setup:pmd"]
description = "Install the pinned PMD if absent (habit-hooks Java sensor + no-var need it)"
run = """
dst="$HOME/.local/opt/pmd-bin-$PMD_VERSION"
if [ -x "$dst/bin/pmd" ]; then exit 0; fi
echo "Installing PMD $PMD_VERSION -> $dst"
mkdir -p "$HOME/.local/opt"
curl -fsSL -o "/tmp/pmd-$PMD_VERSION.zip" "https://github.com/pmd/pmd/releases/download/pmd_releases/$PMD_VERSION/pmd-dist-$PMD_VERSION-bin.zip"
unzip -q -o "/tmp/pmd-$PMD_VERSION.zip" -d "$HOME/.local/opt"
rm -f "/tmp/pmd-$PMD_VERSION.zip"
"""

[tasks.fix]
description = "Auto-format (Spotless; use ratchetFrom('origin/main') to avoid a big-bang reformat)"
run = "./gradlew spotlessApply"

[tasks.lint]
description = "Format check (Spotless) + no-`var` on changed source. Smells run via habit-hooks (PMD)."
# lint is 'style + smells' (CONTRACT.md), not only auto-fixable formatting: Spotless
# is mechanical (`mise run fix`), but no-`var` is a real rule — fix it or tag a
# justified use. Both are non-mutating here. novar is ratchet-scoped (see below), so
# folding it in never fails on legacy `var`.
run = ["./gradlew spotlessCheck", "mise run novar"]

[tasks.typecheck]
description = "Compilation is Java's type check"
run = "./gradlew compileJava"

[tasks.test]
description = "Tests (wire a coverage floor via jacocoTestCoverageVerification)"
run = "./gradlew test"

[tasks.audit]
description = "Dependency CVEs via osv-scanner over a Gradle lockfile (needs osv-scanner on PATH)"
# Enable dependencyLocking { lockAllConfigurations() } in build.gradle.kts; the
# lockfile is generated on demand (gitignored) so lock drift never breaks the gate.
run = [
    "./gradlew dependencies --write-locks",
    "osv-scanner --lockfile=gradle.lockfile",
]

# no-`var` is a ratchet-scoped check: it must fail only on *new* `var`, never on legacy.
# It diffs from the merge-base of a base ref with HEAD — pre-existing `var` is untouched
# until its file is edited. The base ref is FOUNDRY_BASE_REF (the ratchet base, distinct
# from FOUNDRY_SINCE's speed signal), defaulting to origin/main for local runs; CI sets
# it to the PR base SHA, since origin/main isn't a reliable ref in a PR checkout. An
# unresolvable base skips (CI enforces from a full-history checkout, so it's authoritative).
# Folded into `lint` above — no separate CI job needed.
[tasks.novar]
description = "no-`var` on changed Java (ratchet base = FOUNDRY_BASE_REF, default origin/main). Tag exceptions `// foundry-allow-var: reason`."
depends = ["setup:pmd"]
run = '''
set -eu
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "novar: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
files=$(git diff --name-only --diff-filter=ACMR "$mb" 2>/dev/null | grep -E '^src/main/java/.*\.java$' || true)
if [ -z "$files" ]; then echo "novar: no changed main Java files"; exit 0; fi
set --
for f in $files; do set -- "$@" "-d=$f"; done
pmd check "$@" -R config/pmd/no-var.xml -f text --no-progress --suppress-marker foundry-allow-var
'''

[tasks.gate]
description = "The oracle. Sequential — mise `depends` runs in parallel with no ordering."
# Each verb wrapped by `foundry-verb-wrap`: times it, appends a line to FOUNDRY_TELEMETRY,
# propagates the exit code unchanged (telemetry never changes the outcome; a failing verb
# still stops the sequence). Read with `foundry-loop-report`. Wrapper on PATH via scripts/
# ([env]); foundry-init installs it. Not part of the six-verb contract.
run = [
    "foundry-verb-wrap lint      -- mise run lint",
    "foundry-verb-wrap typecheck -- mise run typecheck",
    "foundry-verb-wrap test      -- mise run test",
    "foundry-verb-wrap audit     -- mise run audit",
]
