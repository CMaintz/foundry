# Foundry verb interface - Java (Gradle) template. See CONTRACT.md.
# Commands assume Gradle + Spotless; structural smells come from habit-hooks'
# Java/PMD plugin, not the Gradle build. Adjust for Maven or your plugins.
# Proven on a Spring Boot repo (AutoApplicant); see OVERVIEW.md.
#
# No FOUNDRY_SINCE execute-scoping here, unlike mise/ts.toml - and that's deliberate,
# not an omission (see designs/changed-scope-gate.md). On the JVM the Gradle build
# dominates wall-clock, and Gradle already scopes the fast placements for free:
# Spotless `spotlessCheck` ratchets from origin/main (only changed files), incremental
# compilation scopes `typecheck`, and up-to-date checks skip unaffected `test` work.
# Bolting a changed-file file-list on top would save little and fight the build tool.
# The one ratchet-scoped check that needs an explicit diff is `novar`, below.

[tools]
java = "21"
# jscpd = the duplicated-code detector for the `generic` habit-hooks plugin (the
# java preset enables it alongside PMD). Pinned via mise so local runs, the
# habit-hooks-guard Stop hook, and CI (mise-action runs `mise install`) all resolve
# the SAME version - an unpinned `npm i -g jscpd` drifts and shifts duplication
# findings between machines. Bump in lockstep with any consumer's pin.
"npm:jscpd" = "5.2.1"

# PMD is a JVM app (launcher + jars) whose GitHub release asset has no OS in its
# name, so it can't be a clean [tools] entry. Pin the version here; setup:pmd
# installs it idempotently, the postinstall hook runs that on `mise install`, and
# its bin goes on mise's PATH - so the habit-hooks Java sensor + no-var find PMD
# with no manual install, identically local and in CI.
[env]
PMD_VERSION = "7.27.0"
# habit-hooks (the structural-smell detector) is a pinned, mise-managed pip tool, like
# PMD above - provisioned into a per-plugin venv by setup:habit-hooks (postinstall) whose
# bin goes on PATH below, so the SAME version runs in-loop, pre-push (`gate`) and in CI.
# Core + its Java plugin ship in lockstep, so both pin to this one version. Renovate bumps
# it (presets/renovate.json); keep it == the reusable workflow's `habit_hooks_version`.
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "habit-hooks-java"
# The Foundry scripts (foundry-verb-wrap, foundry-flaky, codemap-check) are provisioned by
# setup:foundry-scripts into a cache dir at this ref, not vendored (see that task).
# Renovate tracks the pin via the comment above it.
# A bump must also update the sha256 lines in setup:foundry-scripts.
# renovate: datasource=github-tags depName=CMaintz/foundry
FOUNDRY_SCRIPTS_REF = "v2.13.0"
# PMD + the habit-hooks venv bin (Linux `bin/`, Windows `Scripts/` - a missing one on PATH
# is harmless), the Foundry scripts cache (so the gate runs `foundry-verb-wrap` by
# name), and the repo's own scripts/ last.
_.path = [
    "{{env.HOME}}/.local/opt/pmd-bin-{{env.PMD_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
    "{{env.HOME}}/.local/opt/foundry-scripts-{{env.FOUNDRY_SCRIPTS_REF}}",
    "{{config_root}}/scripts",
]

# Loop telemetry: each gate verb appends one JSONL line here (see designs/loop-telemetry.md).
# Gitignore `.foundry/`. Read it with the `foundry:loop-report` skill. setup:foundry-scripts caches the wrapper.
FOUNDRY_TELEMETRY = "{{config_root}}/.foundry/telemetry.jsonl"

# -- Jev (advisory layer; opt-in, OFF unless set) --------------------------
# Foundry's near-free System One layer (see docs/FEATURES.md, the "jev/" entry):
# it only routes review and triages turns on the proposer side, never the gate.
# All of it stays off unless a key is present, so this whole block is optional.
#
# The key is NEVER committed: export JEV_API_KEY in your shell, not here. The
# lines below are the safe, non-secret knobs at their defaults; uncomment to
# change one. mise [env] reaches only processes under `mise run`/`mise exec` or
# a mise-activated shell, so a Claude Code hook sees these only when the editor
# was launched from such a shell.
#
# JEV_PROVIDER = "typesafe"           # or "cloudflare" (then set CLOUDFLARE_ACCOUNT_ID)
# JEV_MODEL = "jev-latest"            # pin to a version to freeze behavior
# TYPESAFE_AI_BASE_URL = "https://api.typesafe.ai/v1"   # a self-host, proxy, or mock
# JEV_REVIEW_MIN_FILES = "0"          # skip review routing on diffs at or under N files
# JEV_TOOLCALL_TRIAGE = "0"           # 1 warns on risky tool calls (repos with that hook)
# JEV_FEATURE_PRECHECK = "0"          # 1 pre-checks a feature ticket (repos with that hook)
# LEASH_ENABLED = "0"                 # 1 runs Leash turn checks (repos with the leash.sh hook)

[hooks]
# Provision the pinned tools on `mise install` (local and CI alike). Array form runs
# them in order; each no-ops on a warm install.
postinstall = ["mise run setup:pmd", "mise run setup:habit-hooks", "mise run setup:foundry-scripts"]

[tasks."setup:pmd"]
description = "Install the pinned PMD if absent (habit-hooks Java sensor + no-var need it)"
run = """
dst="$HOME/.local/opt/pmd-bin-$PMD_VERSION"
if [ -x "$dst/bin/pmd" ]; then exit 0; fi
echo "Installing PMD $PMD_VERSION -> $dst"
mkdir -p "$HOME/.local/opt"
curl -fsSL -o "/tmp/pmd-$PMD_VERSION.zip" "https://github.com/pmd/pmd/releases/download/pmd_releases/$PMD_VERSION/pmd-dist-$PMD_VERSION-bin.zip"
unzip -q -o "/tmp/pmd-$PMD_VERSION.zip" -d "$HOME/.local/opt"
rm -f "/tmp/pmd-$PMD_VERSION.zip"
"""

# Fetch the pinned Foundry scripts into a cache dir instead of copying them into the repo
# (agent/CI plumbing, not the repo's code; a copy drifts and needs a re-sync on every bump).
# Every run checks each script against its sha256 below, cached or not: the tag is only a
# locator, so a moved tag, a proxy page or a truncated download is re-fetched once and then
# refused, never cached. A verified cache needs no network, so the gate hot path stays
# offline; a ref bump needs the network once. cut-release.sh writes the digests for the tag
# it cuts, so bumping FOUNDRY_SCRIPTS_REF means taking that tag's digest lines with it.
[tasks."setup:foundry-scripts"]
description = "Fetch the pinned Foundry scripts into a cache dir, sha256-verified"
run = '''
set -eu
# <script> <sha256 of scripts/<script> at FOUNDRY_SCRIPTS_REF>, one per line.
scripts='
foundry-verb-wrap 62d37f02653ee1878e66e5366ee51bedb46aefa935716668adc07d078db02e85
foundry-flaky 4ac1cc27da1071865be3db14c27cfe179ef1bc2aafaa069d8b62801cf920f07f
codemap-check 31a57b4ec25237598abb29f34a28dbcbd1331cee0ca939a9dd8e9caa3985b5da
'
dst="$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF"
base="https://raw.githubusercontent.com/CMaintz/foundry/$FOUNDRY_SCRIPTS_REF/scripts"
# sha256sum ships with Linux and Git Bash; macOS has only shasum.
digest() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
mkdir -p "$dst"
while read -r s want; do
  [ -n "$s" ] || continue
  [ -f "$dst/$s" ] && [ "$(digest "$dst/$s")" = "$want" ] && continue
  # A per-run temp file, moved into place only once verified: concurrent runs (parallel
  # worktrees share $HOME) never write into each other's download or expose a partial one.
  tmp=$(mktemp "$dst/.$s.XXXXXX")
  if ! curl -fsSL "$base/$s" -o "$tmp"; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: cannot fetch $s at $FOUNDRY_SCRIPTS_REF (network needed once per ref)" >&2
    exit 1
  fi
  got=$(digest "$tmp")
  if [ "$got" != "$want" ]; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: $s at $FOUNDRY_SCRIPTS_REF has sha256 $got, expected $want; refusing it." >&2
    echo "  If FOUNDRY_SCRIPTS_REF was just bumped, copy the digest lines from that ref's mise template;" >&2
    echo "  otherwise the download was not the script (proxy or captive page, truncation, moved tag)." >&2
    exit 1
  fi
  chmod +x "$tmp" 2>/dev/null || true
  mv -f "$tmp" "$dst/$s"
done <<EOF
$scripts
EOF
'''

[tasks.fix]
description = "Auto-format (Spotless; use ratchetFrom('origin/main') to avoid a big-bang reformat)"
run = "./gradlew spotlessApply"

[tasks.lint]
description = "Format check (Spotless) + no-`var` + structural smells (habit-hooks/PMD) on changed source."
# lint is 'style + smells' (CONTRACT.md), not only auto-fixable formatting: Spotless
# is mechanical (`mise run fix`), but no-`var` is a real rule - fix it or tag a
# justified use. Both are non-mutating here. novar is ratchet-scoped (see below), so
# folding it in never fails on legacy `var`. `mise run smells` runs the same habit-hooks
# scan CI runs, so `gate` is the same oracle locally and in CI (both skip gracefully with
# no .habit-hooks baseline).
run = ["./gradlew spotlessCheck", "mise run novar", "mise run smells"]

[tasks.typecheck]
description = "Compilation is Java's type check"
run = "./gradlew compileJava"

[tasks.test]
description = "Tests (wire a coverage floor via jacocoTestCoverageVerification)"
run = "./gradlew test"

# Flaky-test triage (opt-in, tier-c auxiliary) - the Java counterpart of ts's `test:flaky`.
# Runs the suite, then `foundry-flaky gate` post-processes Gradle's JUnit XML against
# flaky-baseline.json: a quarantined flake is printed but does not gate; a real failure
# still fails. `gate` also appends the green-streak log that `foundry-flaky prune` reads to
# auto-re-arm tests gone stable (>= M green runs). Fold into `test` when adopted; keep the
# coverage floor on the main `test`. See docs/designs/flake-triager.md. `foundry-flaky` is on
# PATH via the setup:foundry-scripts cache dir.
#
# Classify a failure into flake-vs-real with explicit reruns (NOT `--rerun-tasks`, which
# hides flakes). Quote the id - Gradle's --tests matches fully.qualified.Class.method:
#   foundry-flaky classify --runs 5 --rerun './gradlew test --tests "{test}"' \
#     build/test-results/test flaky-baseline.json
# Parameterized tests report as `method(Type)[1]` / `method[1]`; --tests only matches those
# as a glob (`"...method*"`) and the bracketed id won't round-trip - quarantine by hand.
[tasks."test:flaky"]
description = "Tests, with quarantined flakes reported but not gating (flaky-baseline.json)"
# `|| true`: let the gate decision come from foundry-flaky, not gradle's exit. The report
# dir is globbed and the task FAILS if it is empty (a repo that redirects junitXml via
# reports.junitXml.outputLocation must point this at its real location) - never a silent pass.
run = '''
set -eu
dir="build/test-results/test"
# Clear last run's XML first: `|| true` below swallows a compile failure too, and Gradle
# leaves per-class files behind, so stale XML could otherwise pass the glob and gate green
# on old results.
rm -rf "$dir"
./gradlew test || true
if ! ls "$dir"/*.xml >/dev/null 2>&1; then
  echo "test:flaky: no JUnit XML under $dir - the suite did not run (compile error?) or" >&2
  echo "  reports.junitXml.outputLocation is redirected. Not gating on absent results." >&2
  exit 1
fi
foundry-flaky gate "$dir" flaky-baseline.json
'''

# Codemap drift check (advisory auxiliary, deliberately not in `gate` or `lint`): every
# citation in docs/codemap/*.md must still resolve, and each slice prints how many commits
# touched its cited files since its `sha:`. Exits 0 with a notice when there is no map.
# `codemap-check` is a python3 script on PATH via the setup:foundry-scripts cache dir.
[tasks."codemap:check"]
description = "Advisory: codemap citations still resolve, and how stale each slice is"
run = "codemap-check"

[tasks.audit]
description = "Dependency CVEs via osv-scanner over a Gradle lockfile (needs osv-scanner on PATH)"
# Enable dependencyLocking { lockAllConfigurations() } in build.gradle.kts; the
# lockfile is generated on demand (gitignored) so lock drift never breaks the gate.
run = [
    "./gradlew dependencies --write-locks",
    "osv-scanner --lockfile=gradle.lockfile",
]

# no-`var` is a ratchet-scoped check: it must fail only on *new* `var`, never on legacy.
# It diffs from the merge-base of a base ref with HEAD - pre-existing `var` is untouched
# until its file is edited. The base ref is FOUNDRY_BASE_REF (the ratchet base, distinct
# from FOUNDRY_SINCE's speed signal), defaulting to origin/main for local runs; CI sets
# it to the PR base SHA, since origin/main isn't a reliable ref in a PR checkout. An
# unresolvable base skips (CI enforces from a full-history checkout, so it's authoritative).
# Folded into `lint` above - no separate CI job needed.
[tasks.novar]
description = "no-`var` on changed Java (ratchet base = FOUNDRY_BASE_REF, default origin/main). Tag exceptions `// foundry-allow-var: reason`."
depends = ["setup:pmd"]
run = '''
set -eu
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "novar: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
files=$(git diff --name-only --diff-filter=ACMR "$mb" 2>/dev/null | grep -E '^src/main/java/.*\.java$' || true)
if [ -z "$files" ]; then echo "novar: no changed main Java files"; exit 0; fi
set --
for f in $files; do set -- "$@" "-d=$f"; done
pmd check "$@" -R config/pmd/no-var.xml -f text --no-progress --suppress-marker foundry-allow-var
'''

# Provision the pinned habit-hooks (core + Java plugin, same version) into a per-plugin
# venv. Auxiliary (tier c), like setup:pmd - not a contract verb, run via postinstall on
# `mise install`. Per-plugin dir so a multi-stack machine never reuses another repo's venv.
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + Java plugin into a venv (PMD-backed smell detector)"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
for c in python3 python; do
  if command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION"
'''

# Structural smells (PMD via habit-hooks), folded into `lint` above (tier b, like novar).
# This is the same check CI's habits job runs, so `gate` is the same oracle locally and in
# CI. --branch scopes to files changed vs the ratchet base (FOUNDRY_BASE_REF, default
# origin/main; CI sets the PR base SHA). Degrades gracefully (skip) with no .habit-hooks
# config/snooze or an unresolvable base; FAILS only when a config + baseline exist but
# habit-hooks isn't on PATH (a broken setup - run `mise install`).
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
# The Java sensor shells out to PMD, so provision both. (Via `lint` novar already pulls
# setup:pmd first; naming it here keeps a direct `mise run smells` honest too.)
depends = ["setup:pmd", "setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

# SpotBugs bytecode analysis - auxiliary, opt-in, NOT one of the six contract verbs
# and NOT in `gate` (like `novar`, `arch`, `setup:pmd`). The gate.yml facade runs this
# via `mise run spotbugs` when called with `spotbugs: true`, so a repo controls the exact
# Gradle call here: a single-project repo keeps the default; a root-Gradle monorepo
# overrides it (e.g. `../gradlew :backend:spotbugsMain` from a package's mise.toml). The
# ratchet (exclude.xml / @SuppressFBWarnings) lives in your Gradle SpotBugs config.
[tasks.spotbugs]
description = "SpotBugs bug-pattern analysis (opt-in; blocking in CI via the facade's spotbugs job)"
run = "./gradlew spotbugsMain"

[tasks.gate]
description = "The oracle. Sequential - the VERBS must never be mise `depends` (those run in parallel)."
# The one setup:foundry-scripts dep provisions the cached gate scripts first (idempotent,
# ordered-first) - a safety net for a ref bump not yet followed by `mise install`. The
# VERBS stay in the sequential array (never `depends`, which would run them in parallel,
# unordered, hiding which failed first). Each verb is wrapped by `foundry-verb-wrap`: it
# times the verb, appends a line to FOUNDRY_TELEMETRY, and propagates the exit code
# unchanged (telemetry never changes the outcome). Read with the `foundry:loop-report`
# skill. Wrapper on PATH via the setup:foundry-scripts cache. Not part of the six-verb contract.
depends = ["setup:foundry-scripts"]
run = [
    "foundry-verb-wrap lint      -- mise run lint",
    "foundry-verb-wrap typecheck -- mise run typecheck",
    "foundry-verb-wrap test      -- mise run test",
    "foundry-verb-wrap audit     -- mise run audit",
]
