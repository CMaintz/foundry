# Foundry verb interface — Java (Gradle) template. See CONTRACT.md.
# Commands assume Gradle + Spotless; structural smells come from habit-hooks'
# Java/PMD plugin, not the Gradle build. Adjust for Maven or your plugins.
# Proven on a Spring Boot repo (AutoApplicant); see OVERVIEW.md.

[tools]
java = "21"
# jscpd = the duplicated-code detector for the `generic` habit-hooks plugin (the
# java preset enables it alongside PMD). Pinned via mise so local runs, the
# habit-hooks-guard Stop hook, and CI (mise-action runs `mise install`) all resolve
# the SAME version — an unpinned `npm i -g jscpd` drifts and shifts duplication
# findings between machines. Bump in lockstep with any consumer's pin.
"npm:jscpd" = "5.2.1"

# PMD is a JVM app (launcher + jars) whose GitHub release asset has no OS in its
# name, so it can't be a clean [tools] entry. Pin the version here; setup:pmd
# installs it idempotently, the postinstall hook runs that on `mise install`, and
# its bin goes on mise's PATH — so the habit-hooks Java sensor + no-var find PMD
# with no manual install, identically local and in CI.
[env]
PMD_VERSION = "7.27.0"
_.path = ["{{env.HOME}}/.local/opt/pmd-bin-{{env.PMD_VERSION}}/bin"]

[hooks]
postinstall = "mise run setup:pmd"

[tasks."setup:pmd"]
description = "Install the pinned PMD if absent (habit-hooks Java sensor + no-var need it)"
run = """
dst="$HOME/.local/opt/pmd-bin-$PMD_VERSION"
if [ -x "$dst/bin/pmd" ]; then exit 0; fi
echo "Installing PMD $PMD_VERSION -> $dst"
mkdir -p "$HOME/.local/opt"
curl -fsSL -o "/tmp/pmd-$PMD_VERSION.zip" "https://github.com/pmd/pmd/releases/download/pmd_releases/$PMD_VERSION/pmd-dist-$PMD_VERSION-bin.zip"
unzip -q -o "/tmp/pmd-$PMD_VERSION.zip" -d "$HOME/.local/opt"
rm -f "/tmp/pmd-$PMD_VERSION.zip"
"""

[tasks.fix]
description = "Auto-format (Spotless; use ratchetFrom('origin/main') to avoid a big-bang reformat)"
run = "./gradlew spotlessApply"

[tasks.lint]
description = "Format check (Spotless). Structural smells run via habit-hooks (PMD)."
run = "./gradlew spotlessCheck"

[tasks.typecheck]
description = "Compilation is Java's type check"
run = "./gradlew compileJava"

[tasks.test]
description = "Tests (wire a coverage floor via jacocoTestCoverageVerification)"
run = "./gradlew test"

[tasks.audit]
description = "Dependency CVEs via osv-scanner over a Gradle lockfile (needs osv-scanner on PATH)"
# Enable dependencyLocking { lockAllConfigurations() } in build.gradle.kts; the
# lockfile is generated on demand (gitignored) so lock drift never breaks the gate.
run = [
    "./gradlew dependencies --write-locks",
    "osv-scanner --lockfile=gradle.lockfile",
]

[tasks.novar]
description = "Report `var` uses. Enforce diff-scoped in CI. Tag exceptions `// foundry-allow-var: reason`."
depends = ["setup:pmd"]
run = "pmd check -d src/main/java -R config/pmd/no-var.xml -f text --suppress-marker foundry-allow-var"

[tasks.gate]
description = "The oracle. Sequential — mise `depends` runs in parallel with no ordering."
run = ["mise run lint", "mise run typecheck", "mise run test", "mise run audit"]
