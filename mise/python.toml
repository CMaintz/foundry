# Foundry verb interface - Python template. See CONTRACT.md.
# Six verbs on ruff (lint + format) + mypy + pytest + pip-audit. Proven on jev-rerank;
# this is that gate made reusable. Adjust for poetry/uv/pdm as needed.
#
# Pinning: ruff is a standalone binary, so it is a clean [tools] entry. mypy, pytest
# and pip-audit are NOT [tools] entries on purpose - pytest must import the project and
# its dependencies, mypy needs the project's packages for stubs, and pip-audit must
# audit THIS project's environment; an isolated tool install would check the wrong
# place and pass green. So they are pinned here and installed into a project .venv by
# the setup:pytools task - the same "pin via a setup task + postinstall" mechanism the
# java template uses for PMD. mise-action runs `mise install` in CI, which fires the
# postinstall hook, so local and CI resolve the SAME versions.
#
# Gitignore `.venv/` (the project venv, a build artifact); foundry-init seeds `.foundry/`.

[tools]
# A full patch pin, not "3.12": Renovate reads a bare minor as x.y.0 and proposes the
# oldest patch (3.12.1), whose builds mise cannot verify (no artifact attestations), so
# CI fails at `mise install`. A full pin also makes local and CI identical.
python = "3.14.8"
ruff = "0.16.10" # lint + format; standalone binary, no project deps -> clean pin
gitleaks = "8.24.3" # audit's secret scan

[env]
# Pinned into the project .venv by setup:pytools (see the header note). Renovate tracks
# each one through the `# renovate:` comment above it (the shared preset's annotation
# manager), so keep those comments directly above their pins.
# renovate: datasource=pypi depName=mypy
MYPY_VERSION = "2.4.1"
# renovate: datasource=pypi depName=pytest
PYTEST_VERSION = "9.2.0" # >= 9.0.3: 8.4.2 fails pip-audit (PYSEC-2026-1845)
# renovate: datasource=pypi depName=pytest-cov
PYTEST_COV_VERSION = "7.1.0"
# renovate: datasource=pypi depName=pip-audit
PIP_AUDIT_VERSION = "2.10.1"
# habit-hooks (the structural-smell detector) is a pinned, mise-managed pip tool,
# provisioned into a per-plugin venv by setup:habit-hooks (postinstall) whose bin goes on
# PATH below - so the SAME version runs in-loop, pre-push (`gate`) and in CI (mirrors how
# dotnet.toml wires it). The `python` sensor (ruff) owns the structural smells - complexity,
# too-many-parameters, oversized-function, swallowed-exception - plus unused imports/vars,
# all ratcheted via the snooze baseline; deptry adds unused-dependency, and the bundled
# `generic` sensor adds file-length (+ opt-in jscpd). ruff in `lint` keeps style/correctness/
# format as a hard gate. Core + plugin ship in lockstep, so both pin to this one version.
# Renovate bumps it (presets/renovate.json); keep it == the reusable workflow's
# `habit_hooks_version` default (1.5.0).
HABIT_HOOKS_VERSION = "1.5.0"
HABIT_HOOKS_PLUGIN = "habit-hooks-python"
# deptry (the python sensor's unused-dependency check) is resolved from the project .venv
# (.venv/bin is first on PATH below), so it is installed by setup:pytools alongside the
# other pinned project tools.
# renovate: datasource=pypi depName=deptry
DEPTRY_VERSION = "0.25.1"
# import-linter (the opt-in `arch` task) builds its import graph by importing the project,
# so it must resolve from the project .venv - but setup:pytools installs it ONLY once the
# repo adopts arch (a .importlinter / [tool.importlinter] config exists), so non-adopters
# neither install nor pip-audit it. This pin stays here for Renovate regardless.
# renovate: datasource=pypi depName=import-linter
IMPORT_LINTER_VERSION = "2.15"
# Coverage floor for `test`. Override per repo (a legacy repo can start lower and
# ratchet up); CI inherits whatever you set here.
FOUNDRY_COV_MIN = "90"
# The Foundry scripts (foundry-verb-wrap, foundry-flaky, codemap-check, foundry-explain and
# its rule catalog) are provisioned by setup:foundry-scripts into a cache dir at this ref,
# not vendored (see that task).
# Not Renovate-tracked: a bump must carry that tag's sha256 lines in setup:foundry-scripts,
# which Renovate cannot compute.
FOUNDRY_SCRIPTS_REF = "v2.14.0"
# The project .venv first (so mypy/pytest/pip-audit resolve to the pinned ones), then the
# habit-hooks venv (so `smells` finds the pinned habit-hooks), then the Foundry scripts
# cache (so the gate runs `foundry-verb-wrap` by name), then the repo's own scripts/. Both
# venv bin layouts are listed (bin on Linux/macOS, Scripts on Windows); the absent one is ignored.
_.path = [
    "{{config_root}}/.venv/bin",
    "{{config_root}}/.venv/Scripts",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/bin",
    "{{env.HOME}}/.local/opt/{{env.HABIT_HOOKS_PLUGIN}}-{{env.HABIT_HOOKS_VERSION}}/Scripts",
    "{{env.HOME}}/.local/opt/foundry-scripts-{{env.FOUNDRY_SCRIPTS_REF}}",
    "{{config_root}}/scripts",
]
# Loop telemetry: each gate verb appends one JSONL line here (see designs/loop-telemetry.md).
# Read it with the `foundry:loop-report` skill. setup:foundry-scripts caches the wrapper.
FOUNDRY_TELEMETRY = "{{config_root}}/.foundry/telemetry.jsonl"

# -- Jev (advisory layer; opt-in, OFF unless set) --------------------------
# Foundry's near-free System One layer (see docs/FEATURES.md, the "jev/" entry):
# it only routes review and triages turns on the proposer side, never the gate.
# All of it stays off unless a key is present, so this whole block is optional.
#
# The key is NEVER committed: export JEV_API_KEY in your shell, not here. The
# lines below are the safe, non-secret knobs at their defaults; uncomment to
# change one. mise [env] reaches only processes under `mise run`/`mise exec` or
# a mise-activated shell, so a Claude Code hook sees these only when the editor
# was launched from such a shell.
#
# JEV_PROVIDER = "typesafe"           # or "cloudflare" (then set CLOUDFLARE_ACCOUNT_ID)
# JEV_MODEL = "jev-latest"            # pin to a version to freeze behavior
# TYPESAFE_AI_BASE_URL = "https://api.typesafe.ai/v1"   # a self-host, proxy, or mock
# JEV_REVIEW_MIN_FILES = "0"          # skip review routing on diffs at or under N files
# JEV_TOOLCALL_TRIAGE = "0"           # 1 warns on risky tool calls (repos with that hook)
# JEV_FEATURE_PRECHECK = "0"          # 1 pre-checks a feature ticket (repos with that hook)
# LEASH_ENABLED = "0"                 # 1 runs Leash turn checks (repos with the leash.sh hook)

[hooks]
# The provisioning tasks on `mise install` (local and CI alike): the project .venv tools,
# the pinned habit-hooks venv, and the cached Foundry scripts - the array form the java
# template uses for setup:pmd.
postinstall = ["mise run setup:pytools", "mise run setup:habit-hooks", "mise run setup:foundry-scripts"]

[tasks."setup:pytools"]
description = "Create the project .venv and install the pinned mypy/pytest/pip-audit/deptry (+ the project's own deps)"
# dir = config_root so the postinstall hook writes the .venv next to THIS mise.toml even
# when `mise install` runs from the repo root (a monorepo package, where config_root is
# the package dir). Without it, bare relative paths would seed .venv in the wrong place.
dir = "{{config_root}}"
# Idempotent: a version-stamped marker skips reinstall when nothing changed, so
# `mise install` (local and via mise-action) stays fast on a warm checkout.
run = '''
set -eu
# The pinned interpreter, by absolute path: on Windows, Git Bash can put a system Python
# (C:\PythonXY) ahead of mise's on PATH, and a bare `python` would build the .venv on the
# wrong version - local and CI would then disagree.
base=$(mise which python 2>/dev/null || command -v python3 || command -v python)
stamp=".venv/.foundry-pytools"
# The stamp covers the project's own manifests too, so a changed dependency list
# reinstalls instead of leaving a stale .venv behind.
manifests=$(cat pyproject.toml setup.py setup.cfg requirements.txt 2>/dev/null | cksum | cut -d' ' -f1)
# import-linter backs the OPT-IN `arch` task, so install it only once the repo has adopted
# arch (same three-way config test the `arch` task uses) - a non-adopting repo neither
# pays the install nor audits it under `audit` (pip-audit runs over this .venv). The pin
# stays in [env] for Renovate regardless; folding the resolved spec into `want` means
# ADDING .importlinter later flips the stamp and triggers the reinstall.
arch_pkg=""
if [ -f .importlinter ] || grep -q '^\[importlinter\]' setup.cfg 2>/dev/null || grep -q '^\[tool\.importlinter\]' pyproject.toml 2>/dev/null; then
  arch_pkg="import-linter==$IMPORT_LINTER_VERSION"
fi
want="$("$base" --version 2>&1) $MYPY_VERSION $PYTEST_VERSION $PYTEST_COV_VERSION $PIP_AUDIT_VERSION $DEPTRY_VERSION ${arch_pkg:-no-arch} $manifests"
if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$want" ]; then exit 0; fi
"$base" -m venv --clear .venv  # --clear: a changed Python pin rebuilds, not layers
py=".venv/bin/python"; [ -x "$py" ] || py=".venv/Scripts/python.exe"  # Scripts on Windows
"$py" -m pip install --disable-pip-version-check --quiet --upgrade pip
# $arch_pkg is unquoted on purpose: empty => nothing added; set => one token (no spaces).
"$py" -m pip install --disable-pip-version-check --quiet \
  "mypy==$MYPY_VERSION" "pytest==$PYTEST_VERSION" "pytest-cov==$PYTEST_COV_VERSION" "pip-audit==$PIP_AUDIT_VERSION" "deptry==$DEPTRY_VERSION" $arch_pkg
# Make the project importable so pytest/mypy see its code and deps: editable if it is a
# package (a pyproject.toml that only holds tool config is not), plus requirements.txt
# when present. A failed install fails the task and writes no stamp, so it is retried
# instead of leaving a half-provisioned .venv that the gate would misreport.
if [ -f setup.py ] || [ -f setup.cfg ] || grep -qE '^\[(project|build-system)\]' pyproject.toml 2>/dev/null; then
  "$py" -m pip install --disable-pip-version-check --quiet -e .
fi
if [ -f requirements.txt ]; then
  "$py" -m pip install --disable-pip-version-check --quiet -r requirements.txt
fi
echo "$want" > "$stamp"
'''

# Provision the pinned habit-hooks (core + python plugin, same version) into a per-plugin
# venv. The python sensor shells out to ruff ([tools]) and deptry (.venv) at scan time, and
# the bundled generic sensor adds file-length; all three resolve via the _.path order above.
# Auxiliary (tier c) - not a contract verb, run via postinstall on `mise install`.
[tasks."setup:habit-hooks"]
description = "Install the pinned habit-hooks + python plugin into a venv (ruff smells + deptry; generic file-length)"
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
py=""
# The pinned interpreter first (see setup:pytools), then whatever is on PATH.
for c in "$(mise which python 2>/dev/null || true)" python3 python; do
  if [ -n "$c" ] && command -v "$c" >/dev/null 2>&1 && "$c" --version >/dev/null 2>&1; then py="$c"; break; fi
done
if [ -z "$py" ]; then echo "setup:habit-hooks: no working python3/python on PATH; skipping (install Python to run smells)"; exit 0; fi
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
if "$bin/habit-hooks" --version >/dev/null 2>&1; then exit 0; fi
echo "Installing $HABIT_HOOKS_PLUGIN + habit-hooks $HABIT_HOOKS_VERSION -> $dst"
rm -rf "$dst"
"$py" -m venv "$dst"
bin="$dst/bin"; [ -d "$bin" ] || bin="$dst/Scripts"
"$bin/pip" install --disable-pip-version-check "habit-hooks==$HABIT_HOOKS_VERSION" "$HABIT_HOOKS_PLUGIN==$HABIT_HOOKS_VERSION"
'''

# Structural smells (ruff-based python sensor + deptry + generic file-length, via habit-hooks),
# folded into `lint` below (tier b). Same check CI's habits job runs, so `gate` is the same
# oracle locally and in CI.
# Degrades gracefully (skip) with no .habit-hooks config/snooze or an unresolvable base;
# FAILS only when a config + baseline exist but habit-hooks isn't on PATH (run `mise install`).
[tasks.smells]
description = "Structural smells on changed files (habit-hooks --branch); folded into lint"
depends = ["setup:habit-hooks"]
run = '''
set -eu
dst="$HOME/.local/opt/$HABIT_HOOKS_PLUGIN-$HABIT_HOOKS_VERSION"
hh="$dst/bin/habit-hooks"; [ -x "$hh" ] || hh="$dst/Scripts/habit-hooks.exe"
if [ ! -f .habit-hooks/config.toml ]; then echo "smells: no .habit-hooks/config.toml; skipping"; exit 0; fi
if [ ! -f .habit-hooks/snooze.json ]; then m="smells: no snooze baseline yet (run bootstrap); structural smells are NOT being checked"; echo "$m"; if [ -n "${GITHUB_ACTIONS:-}" ]; then echo "::warning::$m"; fi; exit 0; fi
mb=$(git merge-base "${FOUNDRY_BASE_REF:-origin/main}" HEAD 2>/dev/null || true)
if [ -z "$mb" ]; then echo "smells: cannot resolve base '${FOUNDRY_BASE_REF:-origin/main}'; skipping"; exit 0; fi
[ -x "$hh" ] || { echo "smells: pinned habit-hooks not found at $dst (run 'mise install')" >&2; exit 1; }
echo "smells: $("$hh" --version) --branch base=$mb"
"$hh" --branch "$mb"
'''

# Architecture fitness (opt-in, tier-c auxiliary until you adopt it). Enforces YOUR layer
# map + framework-freedom via import-linter (`lint-imports`), which setup:pytools installs
# into the project .venv ONCE a config exists (import-linter imports the package to build
# its graph, so it must run against the project's own interpreter, not an isolated tool,
# and non-adopters skip the install entirely). Whole-graph, so NOT
# changed-scoped - one stray import anywhere can break a layer. To adopt: copy
# presets/arch/importlinter.ini to .importlinter, set root_package + your layers, record
# today's violations as `ignore_imports`, then fold `mise run arch` into `lint`. Unlike the
# TS/Java presets the baseline lives INLINE in the config, so pruning it rides a
# ruleset-change PR. See presets/arch/SETUP.md and docs/designs/arch-fitness.md.
[tasks.arch]
description = "Architecture fitness: layer boundaries + framework-freedom (import-linter)"
run = '''
set -eu
if [ ! -f .importlinter ] \
   && ! grep -q '^\[importlinter\]' setup.cfg 2>/dev/null \
   && ! grep -q '^\[tool\.importlinter\]' pyproject.toml 2>/dev/null; then
  echo "arch: no import-linter config yet - copy presets/arch/importlinter.ini to .importlinter and fill your layers"
  exit 0
fi
exec lint-imports
'''

[tasks.fix]
description = "Auto-fix lint + format (ruff)"
run = ["ruff check --fix .", "ruff format ."]

[tasks.lint]
description = "Lint + format check (ruff) + structural smells (habit-hooks)"
# ruff subsumes flake8/isort/pyupgrade/etc. as a hard style/correctness/format gate; enable
# the rule sets you want in ruff.toml. The structural smells (complexity, too-many-parameters,
# oversized-function, swallowed-exception) and unused imports/vars are owned by the habit-hooks
# python sensor (ruff), run via `mise run smells` and RATCHETED against the snooze baseline;
# deptry adds unused-dependency and the generic sensor adds file-length (+ opt-in jscpd) - the
# same smell scan CI runs, so `gate` is the same oracle locally and in CI. To avoid double-
# reporting, do NOT also select the sensor's smell codes (C901/PLR0913/PLR0915/BLE001) here.
# ruff ignores .venv by default.
run = ["ruff check .", "ruff format --check .", "mise run smells"]

[tasks.typecheck]
description = "Static types (mypy)"
# Scope: a `files` list under [tool.mypy] (pyproject.toml) or [mypy] (mypy.ini /
# .mypy.ini / setup.cfg) wins - e.g. files = ["src", "tests"] - so bare `mypy` runs. An
# explicit `.` would override that list, so it is passed only when none is configured.
# The fallback walk excludes the project .venv (mypy, unlike ruff/pytest, does not skip it)
# and the vendored scripts/ruleset_guard.py, which is untyped and fails `strict = true`.
run = '''
set -eu
has_files() { [ -f "$1" ] && awk -v sec="$2" '/^\[/ { s = ($0 == sec) } s && /^[[:space:]]*files[[:space:]]*=/ { f = 1 } END { exit !f }' "$1"; }
if has_files pyproject.toml '[tool.mypy]' || has_files mypy.ini '[mypy]' || has_files .mypy.ini '[mypy]' || has_files setup.cfg '[mypy]'; then
  mypy
else
  # `.` stands in for the path separator: mypy matches native paths (backslashes on Windows).
  mypy --exclude '(^|.)(\.venv.|scripts.ruleset_guard\.py$)' .
fi
'''

[tasks.test]
description = "Tests with a coverage floor (default 90; override FOUNDRY_COV_MIN)"
# pytest skips .venv by default (norecursedirs covers dot-dirs).
run = "pytest --cov --cov-fail-under=${FOUNDRY_COV_MIN:-90}"

[tasks."test:flaky"]
description = "Tests, with quarantined flakes reported but not gating (flaky-baseline.json)"
run = '''
set -eu
mkdir -p .foundry
rep=".foundry/pytest-junit.xml"
rm -f "$rep"
pytest --cov --cov-fail-under=${FOUNDRY_COV_MIN:-90} --junit-xml="$rep" || true
[ -f "$rep" ] || { echo "test:flaky: no JUnit report at $rep - the suite did not run (collection error?); not gating on absent results." >&2; exit 1; }
foundry-flaky gate "$rep" flaky-baseline.json
'''

# Codemap drift check (advisory auxiliary, deliberately not in `gate` or `lint`): every
# citation in docs/codemap/*.md must still resolve, and each slice prints how many commits
# touched its cited files since its `sha:`. Exits 0 with a notice when there is no map.
# `codemap-check` is a python3 script on PATH via the setup:foundry-scripts cache dir.
[tasks."codemap:check"]
description = "Advisory: codemap citations still resolve, and how stale each slice is"
run = "codemap-check"

[tasks.audit]
description = "Dependency vulnerabilities (pip-audit over the project .venv) and secrets (gitleaks)"
# --skip-editable: do not audit the editable project itself (it has no release to match);
# runtime + dev deps installed in the .venv are audited.
# The secret scan covers the working tree as git sees it (tracked and untracked files,
# minus .gitignore'd ones), so a key is caught before it is committed. It copies that
# tree out through a throwaway index rather than running `gitleaks dir .` directly,
# which would also read ignored dependency trees (.venv, vendor/, build output) whose
# bundled example keys fail the gate on day one. The repo-root .gitleaks.toml is passed
# explicitly because a package-level mise.toml runs from the package dir, where gitleaks
# would not find it. SAST stays in CI (security.yml).
run = [
    "pip-audit --skip-editable",
    '''
set -eu
root=$(git rev-parse --show-toplevel)
prefix=$(git rev-parse --show-prefix)
set --
if [ -f "$root/.gitleaks.toml" ]; then set -- --config "$root/.gitleaks.toml"; fi
tmp=$(mktemp -d)
trap 'rm -rf "$tmp"' EXIT
idx=$(git rev-parse --git-path index)
if [ -f "$idx" ]; then cp "$idx" "$tmp/index"; fi
GIT_INDEX_FILE="$tmp/index" git -c core.safecrlf=false add -A -- .
GIT_INDEX_FILE="$tmp/index" git checkout-index -a --prefix="$tmp/tree/"
cd "$tmp/tree/$prefix"
gitleaks dir --no-banner --redact "$@" .
''',
]

# Fetch the pinned Foundry scripts into a cache dir instead of copying them into the repo
# (agent/CI plumbing, not the repo's code; a copy drifts and needs a re-sync on every bump).
# Every run checks each script against its sha256 below, cached or not: the tag is only a
# locator, so a moved tag, a proxy page or a truncated download is re-fetched once and then
# refused, never cached. A verified cache needs no network, so the gate hot path stays
# offline; a ref bump needs the network once. cut-release.sh writes the digests for the tag
# it cuts, so bumping FOUNDRY_SCRIPTS_REF means taking that tag's digest lines with it.
[tasks."setup:foundry-scripts"]
description = "Fetch the pinned Foundry scripts into a cache dir, sha256-verified"
run = '''
set -eu
# <file> <sha256 of that file at FOUNDRY_SCRIPTS_REF>, one per line. A bare name is
# scripts/<name>; a path (the rule catalog) is fetched from there, cached by basename.
scripts='
foundry-verb-wrap bec5e917c13c22ed534ea0a3a49e33b099be35f05d8fc39473b0bd960fc4bf0e
foundry-flaky 7636b33a80f8d73857f10dc909592681dd2d0f16fa798fb3f6cf4f12868af424
codemap-check 31a57b4ec25237598abb29f34a28dbcbd1331cee0ca939a9dd8e9caa3985b5da
foundry-explain 6b483daf5867badb4db5d222fccbe717b310deda6ebd064e8f478ec3f2dcef60
presets/rules/catalog.toml c311172c29dd735821e2a0efe566aecc35320f45d375bfac1a2622a43ba4fb9b
presets/rules/matchers.toml 8f0a748fc181e1a37c754d79e7a196e4d9006592e633826c8031b89acba7f455
'
dst="$HOME/.local/opt/foundry-scripts-$FOUNDRY_SCRIPTS_REF"
base="https://raw.githubusercontent.com/CMaintz/foundry/$FOUNDRY_SCRIPTS_REF"
# sha256sum ships with Linux and Git Bash; macOS has only shasum.
digest() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
mkdir -p "$dst"
while read -r s want; do
  [ -n "$s" ] || continue
  case "$s" in */*) src="$s" ;; *) src="scripts/$s" ;; esac
  f="${s##*/}"
  [ -f "$dst/$f" ] && [ "$(digest "$dst/$f")" = "$want" ] && continue
  # A per-run temp file, moved into place only once verified: concurrent runs (parallel
  # worktrees share $HOME) never write into each other's download or expose a partial one.
  tmp=$(mktemp "$dst/.$f.XXXXXX")
  if ! curl -fsSL "$base/$src" -o "$tmp"; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: cannot fetch $s at $FOUNDRY_SCRIPTS_REF (network needed once per ref)" >&2
    exit 1
  fi
  got=$(digest "$tmp")
  if [ "$got" != "$want" ]; then
    rm -f "$tmp"
    echo "setup:foundry-scripts: $s at $FOUNDRY_SCRIPTS_REF has sha256 $got, expected $want; refusing it." >&2
    echo "  If FOUNDRY_SCRIPTS_REF was just bumped, copy the digest lines from that ref's mise template;" >&2
    echo "  otherwise the download was not the script (proxy or captive page, truncation, moved tag)." >&2
    exit 1
  fi
  chmod +x "$tmp" 2>/dev/null || true
  mv -f "$tmp" "$dst/$f"
done <<EOF
$scripts
EOF
'''

[tasks.gate]
description = "The oracle. Sequential - the VERBS must never be mise `depends` (those run in parallel)."
# The one setup:foundry-scripts dep provisions the cached gate script first (idempotent,
# ordered-first) - a safety net for a ref bump not yet followed by `mise install`. The
# VERBS stay in the sequential array (never `depends`, which would run them in parallel,
# unordered). Each verb is wrapped by `foundry-verb-wrap`: it times the verb, appends a line
# to FOUNDRY_TELEMETRY, and propagates the exit code unchanged (a failing verb still stops
# the sequence). Wrapper on PATH via the setup:foundry-scripts cache. Not on the six-verb contract.
depends = ["setup:foundry-scripts"]
run = [
    "foundry-verb-wrap lint      -- mise run lint",
    "foundry-verb-wrap typecheck -- mise run typecheck",
    "foundry-verb-wrap test      -- mise run test",
    "foundry-verb-wrap audit     -- mise run audit",
]
