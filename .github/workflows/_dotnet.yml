# Reusable .NET / C# gate - INTERNAL. Call it via the `gate.yml` facade
# (`uses: CMaintz/foundry/.github/workflows/gate.yml@v2` with `stack: dotnet`), not directly.
#
# Runs the same six verbs a developer runs locally (`mise run gate`). Toolchain (the
# .NET SDK) comes from the repo's mise.toml (`dotnet = "8.0"`). Structural smells come from
# the habit-hooks `dotnet` sensor (SonarAnalyzer structural warnings -> oversized-function,
# high-complexity, too-many-parameters, oversized-file) plus the bundled `generic` sensor
# (file-length) - ratcheted against the snooze baseline, run both folded into `lint` (via
# `mise run smells`) and in the dedicated habits job below. typecheck (`dotnet build
# -warnaserror`) stays the hard gate for compile errors, the built-in CA rules and NuGetAudit.
#
# Input names are snake_case (kebab parses as a subtraction and fails at startup).
name: dotnet

on:
  workflow_call:
    inputs:
      mise_version:
        type: string
        default: "2026.9.2"
      working_directory:
        description: Directory containing mise.toml and the solution/project + .habit-hooks/.
        type: string
        default: "."
      habit_hooks:
        description: >-
          Run the dedicated structural-smell backstop job (the dotnet sensor's Sonar
          structural warnings + file-length + opt-in duplication). NOTE: `lint` (in the gate
          job) now also enforces smells whenever .habit-hooks/config.toml + snooze.json exist;
          this input only toggles the extra backstop. To opt out entirely, remove the
          .habit-hooks/ directory.
        type: boolean
        default: true
      habit_hooks_plugin:
        type: string
        default: "foundry-habit-hooks-dotnet"
      habit_hooks_version:
        description: >-
          habit-hooks release to install. The core and its language plugins ship in
          lockstep, so the plugin is pinned to the same version. Renovate bumps this.
        type: string
        default: "1.5.0"

permissions:
  contents: read

jobs:
  gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # `lint` now runs habit-hooks --branch, which diffs vs the PR base
      # Python for the habit-hooks venv that mise's setup:habit-hooks postinstall builds -
      # BEFORE mise-action so `mise install` can create it. The cache key reads the workflow
      # input; the venv PATH in mise.toml reads HABIT_HOOKS_VERSION ([env]) - they default
      # equal and are both Renovate-managed, so a mismatch is a cache miss, not a wrong version.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Cache habit-hooks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/opt/${{ inputs.habit_hooks_plugin }}-${{ inputs.habit_hooks_version }}
          key: ${{ runner.os }}-habit-hooks-${{ inputs.habit_hooks_plugin }}-${{ inputs.habit_hooks_version }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: ${{ inputs.mise_version }}
          cache: true
      # Build the pinned habit-hooks venv (core + dotnet sensor + generic) BEFORE the verbs.
      # `mise install` already fires this via the postinstall hook; running it explicitly
      # keeps the gate robust if a cache hit skips postinstall, and makes the smells folded
      # into `lint` obvious in the log. The dotnet sensor itself shells out to the .NET SDK
      # that mise-action put on PATH above.
      - name: 'setup: habit-hooks venv (core + dotnet sensor + generic)'
        run: mise run setup:habit-hooks
      # `mise run gate` (lint -> typecheck -> test -> audit), one verb per step so a
      # failure reddens the exact verb and gets a targeted fix. Devs run the composite
      # `mise run gate` locally.
      - name: 'gate: lint'
        id: lint
        # FOUNDRY_BASE_REF is the ratchet base for lint's folded structural-smell check
        # (habit-hooks --branch): the PR base SHA on PRs, empty on dispatch ⇒ fall back to
        # origin/main. The merge-base needs the history that fetch-depth: 0 (above) supplies.
        env:
          FOUNDRY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: mise run lint
      - name: How to fix (lint)
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`lint\` - formatting (\`dotnet format --verify-no-changes\`) or structural smells"
            echo ""
            echo "**Formatting** is mechanical - run it, commit, push:"
            echo '```'
            echo "mise run fix        # = dotnet format"
            echo '```'
            echo "Anything \`format\` leaves is a style issue - the rule + file:line are in the **gate: lint** step log above."
            echo ""
            echo "A structural smell (**oversized-function**, **high-complexity**, **too-many-parameters**, **oversized-file**) is the habit-hooks dotnet sensor, ratcheted against the snooze baseline - refactor toward the finding. The **Structural smells** job has the full fix legend."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: typecheck'
        id: typecheck
        run: mise run typecheck
      - name: How to fix (typecheck)
        if: failure() && steps.typecheck.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`typecheck\` - build (\`dotnet build -warnaserror\`)"
            echo ""
            echo "A compile error or a Roslyn analyzer warning (treated as an error). Not auto-fixable - the file:line is in the **gate: typecheck** step log above; reproduce with \`mise run typecheck\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: test'
        id: test
        run: mise run test
      - name: How to fix (test)
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`test\`"
            echo ""
            echo "A test failed or coverage fell below the floor. Reproduce with \`mise run test\`; the failing test is in the **gate: test** step log above."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: audit'
        id: audit
        run: mise run audit
      - name: How to fix (audit)
        if: failure() && steps.audit.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`audit\` - vulnerable dependency (\`dotnet list package --vulnerable\`)"
            echo ""
            echo "Bump the flagged package (or add a version override) to a patched release. If it's a false positive or unfixable now, accept it deliberately - never silence the whole check."
          } >> "$GITHUB_STEP_SUMMARY"

  habits:
    name: Structural smells
    if: inputs.habit_hooks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # `mise run smells` resolves the merge-base vs the PR base itself
      # Mirror the gate job's environment exactly so this backstop runs the SAME tool versions
      # a developer runs locally: the dotnet sensor shells out to the .NET SDK (from mise) and
      # to the pinned habit-hooks venv (built by setup:habit-hooks), so both must be present -
      # a bare pip install with no SDK would error the sensor (and could seed a blind baseline).
      # Python for the habit-hooks venv comes from setup-python (the dotnet mise.toml does not
      # pin python as a tool, unlike the python stack); cache the venv on the same key as the
      # gate job so it doesn't rebuild each run.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Cache habit-hooks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/opt/${{ inputs.habit_hooks_plugin }}-${{ inputs.habit_hooks_version }}
          key: ${{ runner.os }}-habit-hooks-${{ inputs.habit_hooks_plugin }}-${{ inputs.habit_hooks_version }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: ${{ inputs.mise_version }}
          cache: true
      # Builds the pinned habit-hooks venv (core + dotnet sensor + generic); the .NET SDK is
      # already on PATH from mise-action, so the sensor's build runs.
      - name: 'setup: habit-hooks venv (core + dotnet sensor + generic)'
        run: mise run setup:habit-hooks
      - name: Smells (fails only on smells beyond the snooze baseline)
        id: smells
        # `mise run smells` resolves the merge-base vs FOUNDRY_BASE_REF and scans only the
        # changed files (unchanged files are covered by the snooze baseline). It skips
        # gracefully when there is no .habit-hooks config or no snooze baseline yet.
        env:
          FOUNDRY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: mise run smells
      - name: How to read these smells
        if: failure() && steps.smells.outcome == 'failure'
        run: |
          {
            echo "## 📖 Structural smells"
            echo ""
            echo "These are ratcheted habit-hooks smells (snooze baseline), separate from typecheck's hard gate. The dotnet sensor maps SonarAnalyzer structural warnings to smells; the generic sensor adds file-length."
            echo "| Smell | Fix toward |"
            echo "|---|---|"
            echo "| \`oversized-function\` | extract cohesive steps into named helpers |"
            echo "| \`high-complexity\` | split the branchy logic into smaller methods |"
            echo "| \`too-many-parameters\` | group related args into a type |"
            echo "| \`oversized-file\` | split by concern into cohesive units |"
            echo "| \`duplication\` | extract one shared method/type |"
            echo ""
            echo "Findings (file + line) are in the **Smells** step log above. Full rationale: \`presets/agent/code-standards.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
