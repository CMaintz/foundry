# Tests for the code foundry ships to consumer repos:
#   - pytest - scripts/ruleset_guard.py, the loosening check every consumer's security gate runs.
#   - init-smoke - scripts/foundry-init.sh scaffolds a throwaway repo per stack from THIS
#     checkout; asserts the files land, parse, pass actionlint, and a re-run changes nothing.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pytest==8.4.2
      - run: python -m pytest -q tests
      # ruleset_guard.py is vendored into every consumer and linted by their python gate
      # with foundry's shipped ruff preset (line-length 120). Keep it conformant HERE so a
      # consumer's `ruff format --check` / `ruff check` never trips on the vendored copy -
      # foundry is not otherwise ruff-gated, so without this the script would drift.
      - run: pip install --disable-pip-version-check ruff==0.16.10
      - run: ruff format --check --config presets/lint/ruff.toml scripts/ruleset_guard.py
      - run: ruff check --config presets/lint/ruff.toml scripts/ruleset_guard.py

  init-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint (checksum-verified)
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Scaffold every stack
        env:
          ACTIONLINT: ${{ runner.temp }}/actionlint
        run: bash tests/init-smoke.sh
