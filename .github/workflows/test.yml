# init-smoke: scripts/foundry-init.sh scaffolds a throwaway repo per stack from THIS
# checkout; asserts the files land, parse, pass actionlint, and a re-run changes nothing.
# Kept out of self-gate.yml (`mise run gate`) because it is too slow for the local loop.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  init-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint (checksum-verified)
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Scaffold every stack
        env:
          ACTIONLINT: ${{ runner.temp }}/actionlint
        run: bash tests/init-smoke.sh

  # habit-hooks-js-smoke: the javascript and typescript habit-hooks presets against the
  # real sensors on a throwaway repo in each language. Out of self-gate.yml for the same
  # reason as init-smoke: it installs habit-hooks and the node tools fresh each run.
  habit-hooks-js-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [javascript, typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5
        with:
          # Pin the mise CLI too, or the action resolves "latest" and can 404 on an
          # unpublished release.
          version: "2026.9.4" # Renovate bumps this with the mise_version defaults
          cache: true
      # The version consumers run, read from the template so a Renovate bump there is
      # what this job tests.
      - name: Install habit-hooks
        run: |
          v="$(sed -n 's/^HABIT_HOOKS_VERSION = "\(.*\)"$/\1/p' mise/ts.toml)"
          [ -n "$v" ] || { echo "no HABIT_HOOKS_VERSION in mise/ts.toml" >&2; exit 1; }
          python -m venv "$RUNNER_TEMP/hh"
          "$RUNNER_TEMP/hh/bin/pip" install --disable-pip-version-check \
            "habit-hooks==$v" "habit-hooks-typescript==$v"
      - name: Smells reported for source, not for tests
        env:
          HABIT_SENSORS: ${{ runner.temp }}/hh/bin/habit-sensors
          PRESET: ${{ matrix.preset }}
        run: bash tests/habit-hooks-js-smoke.sh
