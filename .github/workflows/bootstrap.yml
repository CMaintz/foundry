# Reusable habit-hooks baseline refresh — regenerate snooze.json on Linux and
# open a PR with the delta.
#
#   jobs:
#     bootstrap:
#       uses: CMaintz/foundry/.github/workflows/bootstrap.yml@<sha>
#       with:
#         habit_hooks_plugin: habit-hooks-typescript
#       permissions:
#         contents: write
#         pull-requests: write
#       # Optional, so the prune PR's checks run and auto-merge fires (see below):
#       secrets:
#         app_private_key: ${{ secrets.BOOTSTRAP_APP_PRIVATE_KEY }}
#       with:
#         app_client_id: ${{ vars.BOOTSTRAP_APP_CLIENT_ID }}
#
# Why a GitHub App: a PR opened with GITHUB_TOKEN counts as a first-time
# contributor, so its pull_request checks wait for a manual approval and
# auto-merge never fires. Opened as an App, the checks run like any other PR.
# Without the App it still works, but someone has to approve the checks once.
#
# Why a workflow and not a local command: on Windows the full-repo file list
# blows the ~8191-char command-line limit, so the baseline must be regenerated on
# Linux. Why a PR and not a push: main is protected, so a bot push is rejected —
# and the PR touches only snooze.json (no source), so ruleset-guard passes with
# the ruleset-change label.
#
# Refresh uses `--prune` (drops entries for files that no longer have findings —
# it can only SHRINK the baseline) when a baseline already exists, and `--snooze`
# (full create) only when there is none yet. So a routine refresh can never
# silently accept a new smell into the baseline; growth always means human review.
#
# Single-package by default (working_directory). A monorepo runs the sensor once
# per package — copy this workflow and add a regenerate step per package (see the
# AutoApplicant pilot's bootstrap.yml for the multi-package shape).
name: bootstrap

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing mise.toml and .habit-hooks/.
        type: string
        default: "."
      habit_hooks_plugin:
        description: Language plugin package (e.g. habit-hooks-typescript, habit-hooks-java).
        type: string
        required: true
      habit_hooks_version:
        description: >-
          habit-hooks release to install. The core and its language plugins ship in
          lockstep, so the plugin is pinned to the same version. Renovate bumps this.
        type: string
        default: "1.5.0"
      mise_version:
        type: string
        default: "2026.9.2"
      base_branch:
        type: string
        default: "main"
      app_client_id:
        description: >-
          Client ID of a GitHub App with Contents and Pull requests read/write,
          installed on the repo. Opens the PR as the App so its checks run without
          approval. Leave empty to fall back to GITHUB_TOKEN.
        type: string
        default: ""
    secrets:
      app_private_key:
        description: Private key of the GitHub App in app_client_id.
        required: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh habit-hooks baseline
    runs-on: ubuntu-latest
    # contents:write to push the branch; pull-requests:write to open the PR. The
    # caller grants these when invoking (a reusable workflow inherits them).
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: GitHub App token
        id: app
        if: inputs.app_client_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
      # With the App, checkout persists its token, so the branch is pushed as the App too.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      # Toolchain (node, pmd, python, …) comes from the repo's mise.toml, so this
      # step is language-agnostic — whatever the six verbs need is what installs.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: ${{ inputs.mise_version }}
      # TS/Node sensors (knip/ts-morph/jscpd) resolve from node_modules; install
      # them when this is a Node package. Skipped (not masked) otherwise.
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Install habit-hooks
        env:
          HH_VERSION: ${{ inputs.habit_hooks_version }}
          PLUGIN: ${{ inputs.habit_hooks_plugin }}
        run: pip install --disable-pip-version-check "habit-hooks==$HH_VERSION" "$PLUGIN==$HH_VERSION"
      - name: Regenerate (prune to shrink; snooze only to create)
        id: regen
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          # --no-snooze feeds RAW findings: prune needs them to see which baselined
          # files are now clean; snooze needs them to baseline all current smells.
          if [ -f .habit-hooks/snooze.json ]; then
            habit-sensors --all --no-snooze | habit-snooze --prune
            echo "pruned=true" >> "$GITHUB_OUTPUT"   # shrink-only → safe to auto-merge
          else
            habit-sensors --all --no-snooze | habit-snooze --snooze
            echo "pruned=false" >> "$GITHUB_OUTPUT"  # first-time seed → human-reviewed
          fi
      - name: Open a PR with the refreshed baseline
        working-directory: .
        # github/inputs context via env, never inline in run: (shell-injection).
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          WD: ${{ inputs.working_directory }}
          RUN_ID: ${{ github.run_id }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          path="$WD/.habit-hooks/snooze.json"
          path="${path#./}"
          git add "$path"
          if git diff --cached --quiet; then
            echo "baseline unchanged — nothing to do"; exit 0
          fi
          # One branch per package, so a monorepo calling this once per package in the
          # same run (backend + frontend) doesn't push two PRs to the same branch.
          pkg="${WD#./}"; pkg="${pkg%/}"; pkg="${pkg//\//-}"
          branch="chore/refresh-habit-baseline-$RUN_ID${pkg:+-$pkg}"
          [ "$pkg" = "." ] && branch="chore/refresh-habit-baseline-$RUN_ID"
          if [ -n "$APP_SLUG" ]; then
            bot="$APP_SLUG[bot]"
            bot_id=$(gh api "/users/$bot" --jq .id)
            note="Opened by the $APP_SLUG App, so the checks run without approval."
          else
            bot="github-actions[bot]"
            bot_id=41898282
            note="Opened with GITHUB_TOKEN, so the checks wait for one approval (Actions tab). Set app_client_id to skip that."
          fi
          git config user.name "$bot"
          git config user.email "$bot_id+$bot@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore: refresh habit-hooks snooze baseline"
          git push -u origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "chore: refresh habit-hooks snooze baseline" \
            --body "Regenerated by the bootstrap workflow (\`--prune\` where a baseline existed, so it can only **shrink** — a new entry would mean a smell slipped past the gate). Touches only snooze.json, no source, so ruleset-guard passes with the label. $note" \
            --label ruleset-change
          # A prune only ever SHRINKS the baseline (ruleset-guard verifies), so arm
          # auto-merge — it lands once the required checks pass, no rubber-stamp needed.
          # A first-time snooze SEEDS the baseline; leave that for human review. Requires
          # the consumer repo to have "Allow auto-merge" on + branch-protection checks.
          if [ "${{ steps.regen.outputs.pruned }}" = "true" ]; then
            gh pr merge "$branch" --auto --merge && echo "auto-merge armed for $branch"
          fi
