# Foundry runs its OWN security facade on its PRs - dogfooding. The guard, the
# secret scan and semgrep are reusable workflows consumers wire up; without this,
# foundry never exercised them on itself (which is how the foundry-init never-clobber
# and Actions-create-PRs gaps slipped through). source_paths stays at the default
# (foundry has no src/app/lib/), so the BUNDLED ruleset-guard stays dormant and routine
# workflow edits don't demand a label - while the tree-wide inline-suppression and
# test-deletion checks, the secret scan and semgrep all still run.
name: self-security

on:
  # labeled/unlabeled: ruleset-guard judges sign-off labels, so applying one must re-run it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The full-history secret scan; PR runs scan only the PR's commits.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    # security.yml's secret-scan job lists the PR's commits, which needs this.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/security.yml
