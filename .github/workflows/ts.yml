# Reusable TypeScript / Node gate.
#
#   jobs:
#     gate:
#       uses: CMaintz/foundry/.github/workflows/ts.yml@v1
#
# Runs the same six verbs a developer runs locally. If this and `mise run gate`
# on a laptop ever disagree, that is a bug in the setup, not in the code.
#
# Input names are snake_case, not kebab: `${{ inputs.mise-version }}` parses as
# the subtraction `inputs.mise - version` in Actions expressions and fails the
# workflow at startup. Learned the hard way.
name: ts

on:
  workflow_call:
    inputs:
      mise_version:
        description: >-
          Pin mise itself, not just the action. Left unpinned, mise-action asks
          mise.jdx.dev/VERSION for "latest", which can advertise a version whose
          GitHub release assets are not published yet.
        type: string
        default: "2026.9.2"
      working_directory:
        description: Directory containing mise.toml and package.json.
        type: string
        default: "."
      habit_hooks:
        description: Run the structural-smell sensors. Requires a .habit-hooks/ directory.
        type: boolean
        default: true
      habit_hooks_plugin:
        description: Language plugin package for habit-hooks.
        type: string
        default: "habit-hooks-typescript"

permissions:
  contents: read

jobs:
  gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: ${{ inputs.mise_version }}
      # Cache node_modules keyed on the lockfile and skip npm ci on a hit. npm ci
      # otherwise wipes and rebuilds node_modules every run — often the job's long
      # pole (a mise/setup-node npm cache only restores ~/.npm, not node_modules).
      # Shared with the habits job via the same key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: node_modules
        with:
          path: ${{ inputs.working_directory }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working_directory)) }}
      - if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci
      # This IS `mise run gate` (lint -> typecheck -> test -> audit, in order),
      # split one verb per step so a failure reddens the exact verb in the UI and
      # gets a targeted fix. Devs still run the composite `mise run gate` locally.
      - name: 'gate: lint'
        id: lint
        run: mise run lint
      - name: How to fix (lint)
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`lint\` — formatting / style / smells"
            echo ""
            echo "Most of this is **mechanically auto-fixable**. Run it, commit, push:"
            echo '```'
            echo "mise run fix"
            echo '```'
            echo "Whatever \`fix\` leaves behind is a real style/smell issue — the rule, file and line are in the **gate: lint** step log above."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: typecheck'
        id: typecheck
        run: mise run typecheck
      - name: How to fix (typecheck)
        if: failure() && steps.typecheck.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`typecheck\`"
            echo ""
            echo "Type / compilation errors — not auto-fixable. The file:line is in the **gate: typecheck** step log above; reproduce with \`mise run typecheck\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: test'
        id: test
        run: mise run test
      - name: How to fix (test)
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`test\`"
            echo ""
            echo "A test failed or coverage fell below the floor. Reproduce with \`mise run test\`; the failing test and assertion are in the **gate: test** step log above."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: audit'
        id: audit
        run: mise run audit
      - name: How to fix (audit)
        if: failure() && steps.audit.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`audit\` — vulnerable dependency"
            echo ""
            echo "Bump the flagged dependency to a patched version. If it's a false positive or unfixable now, accept that **specific** CVE with justification (osv-scanner.toml / the tool's ignore file) — never silence the whole check."
          } >> "$GITHUB_STEP_SUMMARY"

  habits:
    name: Structural smells
    if: inputs.habit_hooks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # --branch needs the base commit in history to diff against
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: ${{ inputs.mise_version }}
      # knip / ts-morph / jscpd come from node_modules; the sensors are Python.
      # .habit-hooks/snooze.json holds the accepted baseline.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: node_modules
        with:
          path: ${{ inputs.working_directory }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working_directory)) }}
      - if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: pip install --disable-pip-version-check habit-hooks ${{ inputs.habit_hooks_plugin }}
      # `--branch` (below) diffs against `branchBase` (default `main`) to scan only what
      # this branch changed. A PR checkout is detached, so `main` has no local ref and
      # habit-hooks errors rather than guess — point a local `main` at the PR base
      # (in history from fetch-depth: 0). On push, `main` already resolves.
      - name: Make base ref resolvable for --branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git branch -f main "$BASE_SHA"
      - name: Smells (fails only on smells beyond the snooze baseline)
        id: smells
        # --branch: scan only files changed vs the base; unchanged files are already
        # covered by the snooze baseline, so re-scanning them every PR is wasted work.
        run: habit-hooks --branch
      - name: How to read these smells
        if: failure() && steps.smells.outcome == 'failure'
        run: |
          {
            echo "## 📖 Structural smells — what each one means"
            echo ""
            echo "Each smell is a machine-checkable shadow of a function or file doing **more than one thing**. Fix toward the missing abstraction (a value object, a strategy, a named step) — never by splitting to a line count."
            echo ""
            echo "| Smell | What it's telling you | Fix toward |"
            echo "|---|---|---|"
            echo "| \`oversized-function\` | too long to hold one idea | extract a named step / collaborator |"
            echo "| \`oversized-file\` | the file carries too many responsibilities | split by concern into cohesive units |"
            echo "| \`high-complexity\` | too many branches = too many decisions in one place | replace conditionals with polymorphism/strategy; lift guard clauses |"
            echo "| \`too-many-parameters\` | the function juggles too many collaborators | introduce a parameter object, or split the responsibility |"
            echo "| \`deep-nesting\` | a nested block wants to be its own named function | extract it; use early returns |"
            echo "| \`duplication\` | the same logic lives in two places | extract one shared function |"
            echo "| \`dead-code\` / unused export | nothing references it | delete it |"
            echo ""
            echo "Findings (file + line) are in the **Smells** step log above. Full rationale: \`presets/code-standards.md\`. Clearing a smell is necessary, not sufficient — \"is this *one* thing?\" is still your call."
          } >> "$GITHUB_STEP_SUMMARY"
