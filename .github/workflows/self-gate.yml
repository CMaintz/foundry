# foundry runs its own six-verb gate (mise.toml) - the same checks `feature` and `ship`
# run locally, so a green local gate means a green check here. A trigger, not reusable:
# no workflow_call, so consumers can't call foundry's self-checks.
name: self-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # audit's gitleaks scans history, not just the tip
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
        with:
          # Pin the mise CLI too, or the action resolves "latest" and can 404 on an
          # unpublished release.
          version: "2026.9.5" # Renovate bumps this with the mise_version defaults
          cache: true
      - run: mise run gate
