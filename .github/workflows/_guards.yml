# Reusable Tier 0 - language-agnostic checks that run on every repo.
#
#   jobs:
#     tier0:
#       uses: CMaintz/foundry/.github/workflows/_guards.yml@v1
#
# Nothing here knows what language the repo is written in.
name: guards

on:
  workflow_call:
    # Input names are snake_case, not kebab: `${{ inputs.foo-bar }}` parses as
    # `inputs.foo - bar` in Actions expressions and fails the run at startup.
    inputs:
      ruleset_paths:
        description: >-
          Extended regex of paths that constitute "the ruleset". A PR touching
          both these and production source is examined for loosening.
        type: string
        default: '^(eslint\.config\.(js|mjs|cjs)|eslint-suppressions\.json|mise\.toml|vite\.config\.ts|\.habit-hooks/|\.jscpd\.json|\.github/workflows/|ruff\.toml|phpstan\.neon|detekt\.yml|\.dependency-cruiser\.cjs|\.dependency-cruiser-known-violations\.json|\.importlinter|archunit_store/|.*\.editorconfig|.*Directory\.Build\.props|.*tsconfig[A-Za-z.]*\.json|.*\.csproj)'
      source_paths:
        description: Extended regex of production source paths.
        type: string
        default: '^(src|app|lib)/'
      test_paths:
        description: >-
          Extended regex of test files, excluded from source_paths. Tests may
          accompany a ruleset change without tripping the guard.
        type: string
        default: '\.(test|spec)\.[jt]sx?$'
      ruleset_label:
        description: Label that marks a deliberate loosening as approved.
        type: string
        default: "ruleset-change"
      suppression_label:
        description: >-
          Label that approves an added in-source suppression, config demotion or
          deleted test. The ruleset_label is also accepted, so a single blanket
          label still works; this one gives suppressions their own reviewable signal.
        type: string
        default: "suppression"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits, which contents:read cannot do.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip
      # Point gitleaks at the repo's .gitleaks.toml ONLY if it exists. A GITLEAKS_CONFIG
      # that names a missing file is a FATAL error in gitleaks, not a fall-back to its
      # built-in rules - so an unconditional path breaks a repo that has no config
      # (foundry-init writes one, but foundry's own repo and any un-scaffolded repo do not).
      - name: Select gitleaks config
        run: |
          if [ -f .gitleaks.toml ]; then
            echo "GITLEAKS_CONFIG=$GITHUB_WORKSPACE/.gitleaks.toml" >> "$GITHUB_ENV"
            echo "using the repo's .gitleaks.toml"
          else
            echo "no .gitleaks.toml - gitleaks uses its default rules"
          fi
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_CONFIG is set by the step above only when the file is present.
      # Turn a bare red X into actionable guidance when a secret is found.
      - name: Remediation guidance
        if: failure()
        run: |
          {
            echo "## 🔑 Secret scan found something"
            echo ""
            echo "**Decide first - real secret, or false positive?** (Ask if unsure.)"
            echo ""
            echo "- **Real secret:** rotate/revoke at the provider **first**, then remove from code, then purge from history (\`git filter-repo\`) and force-push. Never allowlist a real secret."
            echo "- **False positive** (public-by-design config, dummy test fixture): add the *exact file path* to \`.gitleaks.toml\` \`[allowlist] paths\`, with a note on why. Never allowlist a whole directory."
            echo ""
            echo "The **\`/foundry-secret\`** skill walks through either path."
          } >> "$GITHUB_STEP_SUMMARY"

  ruleset-guard:
    name: Ruleset guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # Two gaming moves the baseline-file guard below cannot see, both checked here on
      # EVERY PR (a pure-source or config-only PR is exactly where they hide):
      #   1. an ADDED in-source suppression / config demotion (`eslint-disable`, `@ts-ignore`,
      #      `@SuppressWarnings`, `# noqa`, `#pragma warning disable`, a coverage-exclusion, a
      #      skipped test, `severity = none`) - it STOPS the tool reporting, so the count in
      #      eslint-suppressions.json / snooze.json never grows.
      #   2. a DELETED test - fewer test definitions in a file than the base had.
      # Both are shrink-only (removing a suppression or adding a test always passes) and both
      # are waved through by the suppression label (or the ruleset-change label).
      - name: Refuse added suppressions and deleted tests
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          SUP_LABEL: ${{ inputs.suppression_label }}
          RULESET_LABEL: ${{ inputs.ruleset_label }}
        run: |
          set -euo pipefail
          BASE=$(git merge-base "$BASE" "$HEAD")

          # Either label is a deliberate, on-record human decision (PR must explain it).
          # Fixed-string match (-F): a label name is never a regex.
          if echo "$LABELS" | tr ',' '\n' | grep -qxF -e "$SUP_LABEL" -e "$RULESET_LABEL"; then
            echo "::notice::'$SUP_LABEL'/'$RULESET_LABEL' label present - allowing suppression/test changes."
            exit 0
          fi

          # scripts/ruleset_guard.py is a consumer-committed canonical copy; an older one
          # predates these checks. Fail LOUD with the fix, not a confusing traceback.
          if ! grep -q 'def test_counts' scripts/ruleset_guard.py; then
            echo "::error::scripts/ruleset_guard.py is outdated (no suppression/test scan). Overwrite your committed copy with foundry's current scripts/ruleset_guard.py (foundry-init skips files that already exist, so copy it in manually)."
            exit 1
          fi

          rc=0
          python3 scripts/ruleset_guard.py inline "$BASE" "$HEAD" || rc=1
          python3 scripts/ruleset_guard.py tests "$BASE" "$HEAD" || rc=1
          if [ "$rc" -eq 0 ]; then
            echo "::notice::No suppression added and no test deleted."
          else
            echo "::error::This PR adds an in-source suppression/config demotion, or deletes a test (listed above). Remove it, or add the '$SUP_LABEL' label AND explain the reason in the PR description."
            exit 1
          fi

      # The guard exists to stop a fixer WEAKENING the gate in the same change
      # that "fixes" it - the cheapest fix for a lint error is to disable the
      # rule. But the risk is asymmetric: *loosening* needs a human; *tightening*
      # (or a change with no semantic effect) is always safe. So a bundled
      # ruleset+source PR is allowed without a label as long as every ruleset
      # file it touches can be PROVEN not to loosen the gate.
      - name: Refuse loosening the gate alongside source changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RULESET_RE: ${{ inputs.ruleset_paths }}
          SOURCE_RE: ${{ inputs.source_paths }}
          TEST_RE: ${{ inputs.test_paths }}
          LABEL: ${{ inputs.ruleset_label }}
          SUP_LABEL: ${{ inputs.suppression_label }}
        run: |
          set -euo pipefail

          # Diff from the merge-base (3-dot), not the raw base tip. pull_request
          # events don't re-fire when the base branch advances, so base.sha goes
          # stale on a PR whose branch sits untouched - and a 2-dot diff then
          # reports files the base changed but this PR never touched (phantom
          # loosening). merge-base scopes to this PR's own commits, matching
          # `gh pr diff`. All downstream uses of BASE (blob(), ruleset_guard.py)
          # inherit it.
          BASE=$(git merge-base "$BASE" "$HEAD")

          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          ruleset=$(echo "$changed" | grep -E "$RULESET_RE" || true)
          source=$(echo "$changed" | grep -E "$SOURCE_RE" | grep -vE "$TEST_RE" || true)

          # Only a bundled ruleset+source change is ever in question.
          if [ -z "$ruleset" ] || [ -z "$source" ]; then
            echo "OK - no bundled ruleset+source change."
            exit 0
          fi

          # An explicit human decision overrides the analysis entirely. Either label
          # counts, so guidance that says "add suppression (or ruleset-change)" holds on a
          # bundled config+source PR too. Fixed-string: a label is never a regex.
          if echo "$LABELS" | tr ',' '\n' | grep -qxF -e "$LABEL" -e "$SUP_LABEL"; then
            echo "::notice::'$LABEL'/'$SUP_LABEL' label present - deliberate ruleset change, allowing."
            exit 0
          fi

          blob() { git show "$1:$2" 2>/dev/null || true; }

          # scripts/ruleset_guard.py must be committed in the calling repo - a
          # reusable workflow runs in the caller's checkout. Copy it from
          # foundry/scripts/ when onboarding.
          review=""
          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            old=$(blob "$BASE" "$f"); new=$(blob "$HEAD" "$f")

            # A change with no semantic content - e.g. a CRLF/LF flip from
            # core.autocrlf, which `eslint --prune-suppressions` provokes - is safe.
            if [ "$(printf '%s' "$old" | tr -d '\r')" = "$(printf '%s' "$new" | tr -d '\r')" ]; then
              echo "  safe (no semantic change): $f"; continue
            fi

            # Per-entry loosening check. An aggregate count is gameable by
            # offsetting (fix one violation, suppress another → net zero); this
            # flags any single suppression/snooze entry that is added or increased.
            case "$f" in
              *eslint-suppressions.json)
                if python3 scripts/ruleset_guard.py eslint "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no suppression added): $f"
                else echo "  REVIEW (suppression added/increased): $f"; review="$review $f"; fi
                ;;
              *snooze.json)
                if python3 scripts/ruleset_guard.py snooze "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no snooze added): $f"
                else echo "  REVIEW (snooze added): $f"; review="$review $f"; fi
                ;;
              *.dependency-cruiser-known-violations.json)
                # Architecture-fitness baseline (dependency-cruiser): same shrink-only
                # property as snooze - an added known violation loosens, pruning is safe.
                if python3 scripts/ruleset_guard.py snooze "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no arch violation added): $f"
                else echo "  REVIEW (arch violation added): $f"; review="$review $f"; fi
                ;;
              *archunit_store/*)
                # ArchUnit FreezingArchRule store: one frozen violation per line. An
                # added line loosens; pruning (fixing a violation) is safe. A DELETED
                # store is caught by the failing test, not here (an empty file adds
                # nothing), which is why adopters disable allowStoreCreation post-seed.
                if python3 scripts/ruleset_guard.py lines "$BASE" "$HEAD" "$f"; then
                  echo "  safe (no frozen violation added): $f"
                else echo "  REVIEW (frozen violation added): $f"; review="$review $f"; fi
                ;;
              *)
                # Config / threshold / workflow files: direction can't be proven
                # generically (is a changed number a raised floor or a lowered
                # one?), so these still need the label.
                echo "  REVIEW (config - direction can't be proven): $f"; review="$review $f"
                ;;
            esac
          done <<< "$ruleset"

          if [ -n "$review" ]; then
            echo "::error::This PR changes source AND makes ruleset changes that may loosen the gate, without the '$LABEL' label:"
            echo "$review" | tr ' ' '\n' | sed '/^$/d;s/^/  /'
            echo ""
            echo "Tighten/raise in a separate PR, or add the '$LABEL' label if the loosening is deliberate."
            exit 1
          fi

          echo "::notice::Ruleset changes are tightening-only or inert - allowed alongside source without a label."

      # Turn the bare red X into the two choices the author actually has.
      - name: Ruleset-guard remediation guidance
        if: failure()
        run: |
          {
            echo "## 🔒 Ruleset guard blocked this PR"
            echo ""
            echo "One of these fired:"
            echo ""
            echo "1. **An added in-source suppression or config demotion** - an \`eslint-disable\`, \`@ts-ignore\`, \`@SuppressWarnings\`, \`# noqa\`, \`#pragma warning disable\`, a coverage-exclusion, a skipped/\`.only\` test, or an \`.editorconfig\`/\`tsconfig\`/\`csproj\` demotion. These silence the gate without touching any baseline file."
            echo "2. **A deleted test** - a test file has fewer test definitions than the base (deleted, or moved out)."
            echo "3. **A gate-defining file** changed alongside source in a way that can't be proven *not* to loosen the gate."
            echo ""
            echo "The step log names the exact file + directive. **Pick one:**"
            echo "- **It's a real fix, not a loosening** → remove the suppression / keep the test, or move a bundled ruleset change to its own PR."
            echo "- **It's deliberate and reviewed** → add the \`suppression\` label (or \`ruleset-change\`) **and explain why in the PR description** (which test and why it's gone, why the rule is suppressed), so a human is on record."
            echo ""
            echo "Removing a suppression, adding a test, tightening a rule, or an inert change (whitespace/CRLF) passes automatically - you only land here when something is being loosened."
          } >> "$GITHUB_STEP_SUMMARY"
