# Reusable habit-hooks baseline refresh — regenerate snooze.json on Linux and
# open a PR with the delta.
#
#   jobs:
#     bootstrap:
#       uses: CMaintz/foundry/.github/workflows/_bootstrap.yml@<sha>
#       with:
#         habit_hooks_plugin: habit-hooks-typescript
#       permissions:
#         contents: write
#         pull-requests: write
#
# Why a workflow and not a local command: on Windows the full-repo file list
# blows the ~8191-char command-line limit, so the baseline must be regenerated on
# Linux. Why a PR and not a push: main is protected, so a bot push is rejected —
# and the PR touches only snooze.json (no source), so ruleset-guard passes with
# the ruleset-change label.
#
# Refresh uses `--prune` (drops entries for files that no longer have findings —
# it can only SHRINK the baseline) when a baseline already exists, and `--snooze`
# (full create) only when there is none yet. So a routine refresh can never
# silently accept a new smell into the baseline; growth always means human review.
#
# Single-package by default (working_directory). A monorepo runs the sensor once
# per package — copy this workflow and add a regenerate step per package (see the
# AutoApplicant pilot's bootstrap.yml for the multi-package shape).
name: bootstrap

on:
  workflow_call:
    inputs:
      working_directory:
        description: Directory containing mise.toml and .habit-hooks/.
        type: string
        default: "."
      habit_hooks_plugin:
        description: Language plugin package (e.g. habit-hooks-typescript, habit-hooks-java).
        type: string
        required: true
      mise_version:
        type: string
        default: "2026.9.2"
      base_branch:
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh habit-hooks baseline
    runs-on: ubuntu-latest
    # contents:write to push the branch; pull-requests:write to open the PR. The
    # caller grants these when invoking (a reusable workflow inherits them).
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Toolchain (node, pmd, python, …) comes from the repo's mise.toml, so this
      # step is language-agnostic — whatever the six verbs need is what installs.
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: ${{ inputs.mise_version }}
      # TS/Node sensors (knip/ts-morph/jscpd) resolve from node_modules; install
      # them when this is a Node package. Skipped (not masked) otherwise.
      - run: if [ -f package-lock.json ]; then npm ci; fi
      - name: Install habit-hooks
        env:
          PLUGIN: ${{ inputs.habit_hooks_plugin }}
        run: pip install --disable-pip-version-check habit-hooks "$PLUGIN"
      - name: Regenerate (prune to shrink; snooze only to create)
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          # --no-snooze feeds RAW findings: prune needs them to see which baselined
          # files are now clean; snooze needs them to baseline all current smells.
          if [ -f .habit-hooks/snooze.json ]; then
            habit-sensors --all --no-snooze | habit-snooze --prune
          else
            habit-sensors --all --no-snooze | habit-snooze --snooze
          fi
      - name: Open a PR with the refreshed baseline
        working-directory: .
        # github/inputs context via env, never inline in run: (shell-injection).
        env:
          GH_TOKEN: ${{ github.token }}
          WD: ${{ inputs.working_directory }}
          RUN_ID: ${{ github.run_id }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          set -euo pipefail
          path="$WD/.habit-hooks/snooze.json"
          path="${path#./}"
          git add "$path"
          if git diff --cached --quiet; then
            echo "baseline unchanged — nothing to do"; exit 0
          fi
          branch="chore/refresh-habit-baseline-$RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore: refresh habit-hooks snooze baseline"
          git push -u origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" \
            --title "chore: refresh habit-hooks snooze baseline" \
            --body "Regenerated by the bootstrap workflow (\`--prune\` where a baseline existed, so it can only **shrink** — a new entry would mean a smell slipped past the gate). Touches only snooze.json, no source, so ruleset-guard passes with the label." \
            --label ruleset-change
