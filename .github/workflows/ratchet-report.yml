# Reusable ratchet report - comment on a PR with how the accepted-debt baselines
# moved, so the ratchet is VISIBLE (progress is otherwise invisible unless you
# diff the baseline files by hand).
#
#   jobs:
#     ratchet:
#       uses: CMaintz/foundry/.github/workflows/ratchet-report.yml@<sha>
#       with:
#         baselines: |
#           eslint-suppressions.json
#           frontend/.habit-hooks/snooze.json
#           backend/.habit-hooks/snooze.json
#       permissions:
#         contents: read
#         pull-requests: write
#
# Each baseline's size is counted format-agnostically as the number of scalar
# leaves (`[paths(scalars)] | length`): for eslint-suppressions.json that's the
# number of (file, rule) suppressions; for a snooze.json array it's the number of
# snoozed entries. A NEGATIVE delta is the goal - the baseline only shrinks. A
# positive one should only appear on a labelled `ruleset-change`.
name: ratchet-report

on:
  workflow_call:
    inputs:
      baselines:
        description: Newline- or space-separated baseline JSON files to report on.
        type: string
        default: |
          eslint-suppressions.json
          .habit-hooks/snooze.json

permissions:
  contents: read

jobs:
  report:
    name: Ratchet report
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # need the base commit to diff the baseline against
      - name: Build and post the ratchet report
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASELINES: ${{ inputs.baselines }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Scalar-leaf count of a JSON blob on stdin; 0 if empty/absent/invalid.
          count() { jq '[paths(scalars)] | length' 2>/dev/null || echo 0; }

          marker="<!-- foundry-ratchet-report -->"
          rows=""; moved=0
          for f in $BASELINES; do
            [ -z "$f" ] && continue
            # `|| true`: a baseline not on the base yet (the PR that adopts Foundry, or
            # the first bootstrap seed) makes `git show` exit 128, which pipefail + -e
            # would turn into a failed job instead of a "before: 0" row.
            before=$( (git show "$BASE:$f" 2>/dev/null || true) | count); before=${before:-0}
            after=$([ -f "$f" ] && count < "$f" || echo 0)
            delta=$((after - before))
            if [ "$delta" -lt 0 ]; then icon="✅ −$(( -delta ))"; moved=1
            elif [ "$delta" -gt 0 ]; then icon="⚠️ +$delta"; moved=1
            else icon="· 0"; fi
            rows="${rows}| \`$f\` | $before | $after | $icon |"$'\n'
          done

          # In-source suppressions have no baseline FILE - the tree is the baseline. Count
          # them tree-wide at base vs head with the same scanner the guard uses, so the
          # report shows this surface too. Skipped if the committed guard predates it.
          if grep -q 'inline-count' scripts/ruleset_guard.py 2>/dev/null; then
            mb=$(git merge-base "$BASE" "$HEAD" 2>/dev/null || echo "$BASE")
            ib=$(python3 scripts/ruleset_guard.py inline-count "$mb" 2>/dev/null || echo 0)
            ia=$(python3 scripts/ruleset_guard.py inline-count "$HEAD" 2>/dev/null || echo 0)
            delta=$((ia - ib))
            if [ "$delta" -lt 0 ]; then icon="✅ −$(( -delta ))"; moved=1
            elif [ "$delta" -gt 0 ]; then icon="⚠️ +$delta"; moved=1
            else icon="· 0"; fi
            rows="${rows}| inline suppressions (tree-wide) | $ib | $ia | $icon |"$'\n'
          fi

          {
            echo "$marker"
            echo "### 🔧 Ratchet report"
            echo ""
            echo "| Baseline | Before | After | Δ |"
            echo "|---|--:|--:|--:|"
            printf '%s' "$rows"
            echo ""
            if [ "$moved" -eq 0 ]; then
              echo "_No baseline changed._"
            else
              echo "_A negative Δ is the goal - baselines only shrink. A positive Δ should only appear on a PR labelled \`ruleset-change\`._"
            fi
          } > body.md

          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "map(select(.body|startswith(\"$marker\"))) | .[0].id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$(cat body.md)" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$(cat body.md)" >/dev/null
          fi
          echo "Ratchet report posted."
