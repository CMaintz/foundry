name: jev-scripts
# Runs the advisory Jev layer's own unit tests (node:test, zero deps), including the
# boundary guard that keeps Jev out of the deterministic gate. NOT a gate itself - it
# tests the proposer-side scripts. Only fires when those scripts change.
on:
  pull_request:
    paths: ['scripts/jev/**']
  push:
    branches: [main]
    paths: ['scripts/jev/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test scripts/jev/*.test.mjs
