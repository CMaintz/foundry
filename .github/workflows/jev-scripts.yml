name: jev-scripts
# Runs the advisory Jev layer's own unit tests (node:test, zero deps), including the
# boundary guard that keeps Jev out of the deterministic gate. NOT a gate itself - it
# tests the proposer-side scripts. Only fires when those scripts change.
on:
  pull_request:
    paths: ['scripts/jev/**']
  push:
    branches: [main]
    paths: ['scripts/jev/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: node --test scripts/jev/*.test.mjs
