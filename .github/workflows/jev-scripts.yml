name: jev-scripts
# Runs the advisory Jev layer's own unit tests (node:test, zero deps), including the
# boundary guard that keeps Jev out of the deterministic gate. NOT a gate itself - it
# tests the proposer-side scripts. Only fires when those scripts change.
on:
  pull_request:
    paths: ['scripts/jev/**']
  push:
    branches: [main]
    paths: ['scripts/jev/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: node --test scripts/jev/*.test.mjs
