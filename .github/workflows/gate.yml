# The public gate FACADE — the one stable entrypoint a consumer pins for the language
# gate + structural smells, whatever the stack. Consumers pin THIS, not the per-stack
# files; the `_`-prefixed internals (_java/_ts/_php) are implementation and may change.
#
#   jobs:
#     gate:
#       uses: CMaintz/foundry/.github/workflows/gate.yml@v2
#       with: { stack: java, working_directory: backend }   # monorepo: call once per package
#
# Dispatches by `stack` to the internal per-stack workflow via a nested local `uses:`
# (`./…/_java.yml`), which GitHub resolves to THIS repo at the ref the consumer pinned —
# so there is no cross-repo pin to keep in sync. Require the `gate-ok` check in branch
# protection: its name is stable regardless of which stack ran.
name: gate

on:
  workflow_call:
    inputs:
      stack:
        description: "java | ts | php | dotnet | python - selects the per-stack gate."
        type: string
        required: true
      working_directory:
        type: string
        default: "."
      mise_version:
        type: string
        default: "2026.9.2"
      habit_hooks:
        description: >-
          Run the dedicated structural-smell backstop job. `lint` (in the gate job) now
          also enforces smells whenever .habit-hooks/config.toml + snooze.json exist, so
          this only toggles the extra backstop. Remove the .habit-hooks/ dir to opt out.
        type: boolean
        default: true
      habit_hooks_plugin:
        description: Override the habit-hooks language plugin (empty ⇒ the stack's own default).
        type: string
        default: ""
      habit_hooks_version:
        type: string
        default: "1.5.0"
      # Java-only (ignored for other stacks): runs the `spotbugs` mise task.
      spotbugs:
        type: boolean
        default: false
      osv_scanner_version:
        type: string
        default: "2.5.1"
      pmd_version:
        type: string
        default: "7.27.0"

permissions:
  contents: read

jobs:
  java:
    if: inputs.stack == 'java'
    uses: ./.github/workflows/_java.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      mise_version: ${{ inputs.mise_version }}
      habit_hooks: ${{ inputs.habit_hooks }}
      habit_hooks_plugin: ${{ inputs.habit_hooks_plugin || 'habit-hooks-java' }}
      habit_hooks_version: ${{ inputs.habit_hooks_version }}
      spotbugs: ${{ inputs.spotbugs }}
      osv_scanner_version: ${{ inputs.osv_scanner_version }}
      pmd_version: ${{ inputs.pmd_version }}
  ts:
    if: inputs.stack == 'ts'
    uses: ./.github/workflows/_ts.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      mise_version: ${{ inputs.mise_version }}
      habit_hooks: ${{ inputs.habit_hooks }}
      habit_hooks_plugin: ${{ inputs.habit_hooks_plugin || 'habit-hooks-typescript' }}
      habit_hooks_version: ${{ inputs.habit_hooks_version }}
  php:
    if: inputs.stack == 'php'
    uses: ./.github/workflows/_php.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      mise_version: ${{ inputs.mise_version }}
      habit_hooks: ${{ inputs.habit_hooks }}
      habit_hooks_plugin: ${{ inputs.habit_hooks_plugin || 'habit-hooks-php' }}
      habit_hooks_version: ${{ inputs.habit_hooks_version }}
  dotnet:
    if: inputs.stack == 'dotnet'
    uses: ./.github/workflows/_dotnet.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      mise_version: ${{ inputs.mise_version }}
      habit_hooks: ${{ inputs.habit_hooks }}
      habit_hooks_plugin: ${{ inputs.habit_hooks_plugin || 'habit-hooks-generic' }}
      habit_hooks_version: ${{ inputs.habit_hooks_version }}
  python:
    if: inputs.stack == 'python'
    uses: ./.github/workflows/_python.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      mise_version: ${{ inputs.mise_version }}
      habit_hooks: ${{ inputs.habit_hooks }}
      habit_hooks_plugin: ${{ inputs.habit_hooks_plugin || 'habit-hooks-python' }}
      habit_hooks_version: ${{ inputs.habit_hooks_version }}

  # Stable required check: the dispatched stack passed (skipped stacks are fine), and the
  # `stack` value was actually one we handle (a typo must fail, not silently pass green).
  gate-ok:
    if: always()
    needs: [java, ts, php, dotnet, python]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the dispatched stack succeeded
        env:
          STACK: ${{ inputs.stack }}
          R_JAVA: ${{ needs.java.result }}
          R_TS: ${{ needs.ts.result }}
          R_PHP: ${{ needs.php.result }}
          R_DOTNET: ${{ needs.dotnet.result }}
          R_PYTHON: ${{ needs.python.result }}
        run: |
          set -euo pipefail
          echo "stack=$STACK  java=$R_JAVA ts=$R_TS php=$R_PHP dotnet=$R_DOTNET python=$R_PYTHON"
          case "$STACK" in
            java|ts|php|dotnet|python) : ;;
            *) echo "::error::unknown stack '$STACK' (expected java|ts|php|dotnet|python)"; exit 1 ;;
          esac
          for r in "$R_JAVA" "$R_TS" "$R_PHP" "$R_DOTNET" "$R_PYTHON"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::the $STACK gate did not pass"; exit 1
            fi
          done
          echo "gate ok"
