# The public security FACADE - one stable entrypoint for the language-agnostic checks:
# secret scan + ruleset-guard (via internal _guards.yml) and SAST (via internal
# _semgrep.yml). Consumers pin THIS; the `_`-prefixed internals are implementation.
#
#   jobs:
#     security:
#       uses: CMaintz/foundry/.github/workflows/security.yml@v2
#       permissions: { contents: read, pull-requests: read }   # the secret scan lists PR commits
#       with: { ruleset_paths: '^(mise\.toml|backend/.habit-hooks/|…)' }
#
# Trigger the caller on `pull_request: { types: [opened, synchronize, reopened, labeled, unlabeled] }`:
# ruleset-guard only accepts a sign-off label applied after the latest push, so applying
# one has to re-run it. Require the `security-ok` check in branch protection.
# Also trigger it on a weekly `schedule` and `workflow_dispatch`: only those scan full history.
name: security

on:
  workflow_call:
    inputs:
      ruleset_paths:
        description: "Extended regex of gate-defining paths (ruleset-guard)."
        type: string
        default: '^(eslint\.config\.(js|mjs|cjs)|eslint-suppressions\.json|mise\.toml|(.*/)?(vite|vitest|jest)\.config\.[cm]?[jt]s|\.habit-hooks/|\.jscpd\.json|\.github/workflows/|ruff\.toml|phpstan\.neon|detekt\.yml|\.dependency-cruiser\.cjs|\.dependency-cruiser-known-violations\.json|\.importlinter|archunit_store/|.*\.editorconfig|.*Directory\.Build\.props|.*tsconfig[A-Za-z.]*\.json|.*\.csproj|(.*/)?\.coveragerc|(.*/)?\.?codecov\.ya?ml|(.*/)?phpunit\.xml(\.dist)?|.*\.runsettings|(.*/)?flaky-baseline\.json)'
      source_paths:
        type: string
        default: '^(src|app|lib)/'
      test_paths:
        type: string
        default: '\.(test|spec)\.[jt]sx?$'
      ruleset_label:
        type: string
        default: "ruleset-change"
      suppression_label:
        type: string
        default: "suppression"
      semgrep_config:
        type: string
        default: "p/ci"
      semgrep_version:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  guards:
    # A nested reusable workflow can use at most the permissions of the job that calls
    # it. Without this, `guards` inherits the file-level `contents: read` and _guards'
    # secret-scan job (which needs `pull-requests: read` to list the PR's commits) is
    # rejected, and the whole run ends in `startup_failure`. The consumer's caller job
    # must grant the same (see the usage example above).
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_guards.yml
    with:
      ruleset_paths: ${{ inputs.ruleset_paths }}
      source_paths: ${{ inputs.source_paths }}
      test_paths: ${{ inputs.test_paths }}
      ruleset_label: ${{ inputs.ruleset_label }}
      suppression_label: ${{ inputs.suppression_label }}
  sast:
    # A scheduled or manual run is the full-history secret scan; without a PR base,
    # semgrep would scan the whole tree and fail on findings the ratchet already accepted.
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/_semgrep.yml
    with:
      config: ${{ inputs.semgrep_config }}
      semgrep_version: ${{ inputs.semgrep_version }}

  security-ok:
    if: always()
    needs: [guards, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the security checks passed
        env:
          R_GUARDS: ${{ needs.guards.result }}
          R_SAST: ${{ needs.sast.result }}
        run: |
          set -euo pipefail
          echo "guards=$R_GUARDS sast=$R_SAST"
          for r in "$R_GUARDS" "$R_SAST"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::a security check did not pass"; exit 1
            fi
          done
          echo "security ok"
