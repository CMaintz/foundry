# Reusable Java / Gradle gate.
#
#   jobs:
#     gate:
#       uses: CMaintz/foundry/.github/workflows/_java.yml@<sha>
#       with:
#         spotbugs: true      # opt-in bytecode analysis
#
# no-`var` is not an input: it's folded into `lint` (mise.toml), enforced by the gate.
#
# Runs the same six verbs a developer runs locally (`mise run gate`). If this and
# a laptop ever disagree, that's a bug in the setup, not the code. Toolchain (JDK)
# comes from the repo's mise.toml; Gradle caching from setup-gradle.
#
# Input names are snake_case, not kebab: `${{ inputs.mise-version }}` parses as
# the subtraction `inputs.mise - version` and fails the workflow at startup.
name: java

on:
  workflow_call:
    inputs:
      mise_version:
        type: string
        default: "2026.9.2"
      working_directory:
        description: Directory containing mise.toml, gradlew and .habit-hooks/.
        type: string
        default: "."
      habit_hooks:
        description: >-
          Run the dedicated structural-smell backstop job (PMD via habit-hooks). NOTE:
          `lint` (in the gate job) now also enforces smells whenever
          .habit-hooks/config.toml + snooze.json exist; this input only toggles the extra
          backstop. To opt out entirely, remove the .habit-hooks/ directory.
        type: boolean
        default: true
      habit_hooks_plugin:
        type: string
        default: "habit-hooks-java"
      habit_hooks_version:
        description: >-
          habit-hooks release to install. The core and its language plugins ship in
          lockstep, so the plugin is pinned to the same version. Renovate bumps this.
        type: string
        default: "1.5.0"
      spotbugs:
        description: >-
          Run SpotBugs (opt-in). Invokes the `spotbugs` mise task, so the consumer
          decides the exact Gradle call - the java template defaults it to
          `./gradlew spotbugsMain`; a root-Gradle monorepo overrides it (e.g.
          `../gradlew :backend:spotbugsMain`). Auxiliary, not a contract verb.
        type: boolean
        default: false
      osv_scanner_version:
        type: string
        default: "2.5.1"
      pmd_version:
        type: string
        default: "7.27.0"

permissions:
  contents: read

jobs:
  gate:
    name: Deterministic gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Spotless ratchetFrom origin/main needs history, not a shallow tip
      # If the repo pins PMD via the mise.toml postinstall hook, `mise install` here
      # would re-download it every run even though the gate doesn't use PMD. Restore
      # it first so setup:pmd no-ops on a hit (harmless empty cache if PMD isn't pinned).
      - name: Cache PMD
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/opt/pmd-bin-${{ inputs.pmd_version }}
          key: pmd-${{ inputs.pmd_version }}
      # `lint` now folds in the structural-smell check (habit-hooks --branch), a Python
      # tool. Pin Python and restore its venv BEFORE mise-action, so the mise
      # setup:habit-hooks postinstall no-ops on a hit. The cache key reads the workflow
      # input; the venv PATH in mise.toml reads HABIT_HOOKS_VERSION ([env]) - they default
      # equal and are both Renovate-managed, so a mismatch is a cache miss, not a wrong version.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Cache habit-hooks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/opt/${{ inputs.habit_hooks_plugin }}-${{ inputs.habit_hooks_version }}
          key: ${{ runner.os }}-habit-hooks-${{ inputs.habit_hooks_plugin }}-${{ inputs.habit_hooks_version }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: ${{ inputs.mise_version }}
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # `mise run audit` shells out to osv-scanner over a generated Gradle lockfile.
      - name: Install osv-scanner
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${{ inputs.osv_scanner_version }}/osv-scanner_linux_amd64"
          chmod +x "$HOME/.local/bin/osv-scanner"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # This IS `mise run gate` (lint -> typecheck -> test -> audit, in order),
      # split one verb per step so a failure reddens the exact verb in the UI and
      # gets a targeted fix. Devs still run the composite `mise run gate` locally.
      - name: 'gate: lint'
        id: lint
        # FOUNDRY_BASE_REF is the ratchet base for lint's no-`var` check AND its folded
        # structural-smell check (habit-hooks --branch) - see mise.toml: the PR base SHA on
        # PRs (origin/main isn't a reliable ref in a PR checkout), empty on dispatch ⇒ both
        # fall back to origin/main. fetch-depth: 0 (above) supplies the merge-base history.
        env:
          FOUNDRY_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: mise run lint
      - name: How to fix (lint)
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`lint\` - formatting (Spotless) or no-\`var\`"
            echo ""
            echo "**Formatting** is 100% mechanical - run it, commit, push:"
            echo '```'
            echo "mise run fix        # = ./gradlew spotlessApply"
            echo '```'
            echo "**no-\`var\`** is not auto-fixable: replace \`var\` with the explicit type, or tag a justified use \`// foundry-allow-var: reason\`. It only flags \`var\` on files this PR changed."
            echo "**Structural smells** (PMD via habit-hooks) also run here, scoped to changed files; the dedicated 'Structural smells' job is an additional backstop. The offending files are in the **gate: lint** step log above."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: typecheck'
        id: typecheck
        run: mise run typecheck
      - name: How to fix (typecheck)
        if: failure() && steps.typecheck.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`typecheck\` - compilation"
            echo ""
            echo "Not auto-fixable. The file:line is in the **gate: typecheck** step log above; reproduce with \`mise run typecheck\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: test'
        id: test
        run: mise run test
      - name: How to fix (test)
        if: failure() && steps.test.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`test\`"
            echo ""
            echo "A test failed or coverage fell below the floor. Reproduce with \`mise run test\`; the failing test is in the **gate: test** step log and the uploaded test report artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 'gate: audit'
        id: audit
        run: mise run audit
      - name: How to fix (audit)
        if: failure() && steps.audit.outcome == 'failure'
        run: |
          {
            echo "## ❌ Gate failed at \`audit\` - vulnerable dependency"
            echo ""
            echo "Bump the flagged dependency (or a version override) to a patched release. If it's a false positive or unfixable now, accept that **specific** CVE with justification in osv-scanner.toml - never silence the whole check."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish test report
        if: always() # a failing run is exactly when the report is worth having
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: java-test-report
          path: ${{ inputs.working_directory }}/build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore

  habits:
    name: Structural smells
    if: inputs.habit_hooks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Baseline present?
        id: baseline
        run: |
          if [ -f .habit-hooks/snooze.json ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No .habit-hooks/snooze.json yet - run bootstrap.yml once. Skipping."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      # Python BEFORE mise-action so the mise setup:habit-hooks postinstall can build its venv.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.baseline.outputs.have == 'true'
        with:
          python-version: '3.12'
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        if: steps.baseline.outputs.have == 'true'
        with:
          version: ${{ inputs.mise_version }}
      - name: Cache PMD
        if: steps.baseline.outputs.have == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/opt/pmd-bin-${{ inputs.pmd_version }}
          key: pmd-${{ inputs.pmd_version }}
      - name: Install PMD + habit-hooks
        if: steps.baseline.outputs.have == 'true'
        env:
          HH_VERSION: ${{ inputs.habit_hooks_version }}
          PLUGIN: ${{ inputs.habit_hooks_plugin }}
        run: |
          if [ ! -x "$HOME/.local/opt/pmd-bin-${{ inputs.pmd_version }}/bin/pmd" ]; then
            mkdir -p "$HOME/.local/opt"
            curl -fsSL -o /tmp/pmd.zip \
              "https://github.com/pmd/pmd/releases/download/pmd_releases/${{ inputs.pmd_version }}/pmd-dist-${{ inputs.pmd_version }}-bin.zip"
            unzip -q /tmp/pmd.zip -d "$HOME/.local/opt"
          fi
          echo "$HOME/.local/opt/pmd-bin-${{ inputs.pmd_version }}/bin" >> "$GITHUB_PATH"
          pip install --disable-pip-version-check "habit-hooks==$HH_VERSION" "$PLUGIN==$HH_VERSION"
      # `--branch` (below) diffs the checked-out branch against `branchBase` (habit-hooks
      # default `main`) and scans ONLY what this branch changed - not the whole tree on
      # every PR (the full scan is a baseline-time job, see bootstrap.yml). A PR checkout
      # is detached at the merge commit, so `main` has no local ref and habit-hooks
      # refuses to guess (a hard error, never a silent pass). Point a local `main` at the
      # PR base - already in history from fetch-depth: 0. On push, `main` already resolves.
      - name: Make base ref resolvable for --branch
        if: steps.baseline.outputs.have == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git branch -f main "$BASE_SHA"
      - name: Smells (fails only on smells beyond the snooze baseline)
        id: smells
        if: steps.baseline.outputs.have == 'true'
        # --branch: scan only files changed vs the base. Unchanged files are already
        # covered by the snooze baseline; re-scanning them every PR is wasted work.
        run: habit-hooks --branch
      - name: How to read these smells
        if: failure() && steps.smells.outcome == 'failure'
        run: |
          {
            echo "## 📖 Structural smells - what each one means"
            echo ""
            echo "Each smell is a machine-checkable shadow of a function or file doing **more than one thing**. Fix toward the missing abstraction (a value object, a strategy, a named step) - never by splitting to a line count."
            echo ""
            echo "| Smell | What it's telling you | Fix toward |"
            echo "|---|---|---|"
            echo "| \`oversized-function\` | too long to hold one idea | extract a named step / collaborator |"
            echo "| \`oversized-file\` | the file carries too many responsibilities | split by concern into cohesive units |"
            echo "| \`high-complexity\` | too many branches = too many decisions in one place | replace conditionals with polymorphism/strategy; lift guard clauses |"
            echo "| \`too-many-parameters\` | the function juggles too many collaborators | introduce a parameter object, or split the responsibility |"
            echo "| \`deep-nesting\` | a nested block wants to be its own named function | extract it; use early returns |"
            echo "| \`duplication\` | the same logic lives in two places | extract one shared function |"
            echo "| \`dead-code\` / unused export | nothing references it | delete it |"
            echo ""
            echo "Findings (file + line) are in the **Smells** step log above. Full rationale: \`presets/agent/code-standards.md\`. Clearing a smell is necessary, not sufficient - \"is this *one* thing?\" is still your call."
          } >> "$GITHUB_STEP_SUMMARY"

  spotbugs:
    name: SpotBugs
    if: inputs.spotbugs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Python before mise-action: `mise install` runs the setup:habit-hooks postinstall,
      # which builds a venv even though SpotBugs doesn't use it. Giving it a venv-capable
      # Python keeps that provisioning from failing the job.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: ${{ inputs.mise_version }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Runs the consumer's `spotbugs` mise task (java template default:
      # `./gradlew spotbugsMain`), so a root-Gradle monorepo can point it at
      # `../gradlew :backend:spotbugsMain` without foundry knowing the layout. The
      # ratchet (exclude.xml / @SuppressFBWarnings) lives in the consumer's Gradle config.
      - run: mise run spotbugs

  # no-`var` used to be a separate job here. It's now folded into `lint` (mise.toml),
  # so the deterministic gate enforces it in one place - locally and in CI - and it's
  # no longer opt-in. The gate job's checkout uses fetch-depth: 0, and it passes
  # FOUNDRY_BASE_REF (the PR base SHA) so novar diff-scopes correctly. See
  # designs/verb-tiers.md and designs/changed-scope-gate.md.
